name: Private source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      # release:prepare runs clean npm ci, typecheck, standard tests,
      # test:security, two builds, pack/install/SRI checks and example parsing.
      - run: npm run release:prepare -- "${{ runner.temp }}/darktrace-mcp-release"
  docker:
    needs: offline
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Fetch and authenticate immutable archived runtime inputs
        run: node scripts/prepare-docker-runtime.mjs "$RUNNER_TEMP/runtime-inputs" "${{ matrix.arch }}" > "$RUNNER_TEMP/runtime-inputs-fetch.log" 2>&1
      - name: Build local private image
        run: docker buildx build --platform "linux/${{ matrix.arch }}" --build-context "runtime-apks=$RUNNER_TEMP/runtime-inputs/${{ matrix.arch }}" --load --tag darktrace-mcp:ci .
      - name: Full vendor Node 24 Linux gates (native architecture)
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --platform "linux/${{ matrix.arch }}" --build-context "runtime-apks=$RUNNER_TEMP/runtime-inputs/${{ matrix.arch }}" --target vendor-checks --load --tag darktrace-mcp:vendor-checks .
          mkdir -p "$RUNNER_TEMP/vendor-results"
          chmod 777 "$RUNNER_TEMP/vendor-results"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /scratch:rw,exec,uid=1000,gid=1000,mode=700 --tmpfs /tmp:rw,exec,uid=1000,gid=1000,mode=1777 \
            --mount "type=bind,src=$RUNNER_TEMP/vendor-results,dst=/results" \
            --entrypoint /bin/sh darktrace-mcp:vendor-checks -ec '
              cp -R /work/. /scratch/
              cd /scratch
              trap "cp -R test/security/evidence /results/security-evidence 2>/dev/null || true" EXIT
              node -p "JSON.stringify({node:process.versions.node,openssl:process.versions.openssl,shared:process.config.variables.node_shared_openssl,arch:process.arch})" > /results/runtime.json
              npm run typecheck > /results/typecheck.log 2>&1
              npm test > /results/functional.log 2>&1
              npm run test:security > /results/security.log 2>&1
            '
          # Totals for the full-API release; recompute after merging branches that add tests.
          node --input-type=commonjs <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          for(const [name,count] of [['functional',149],['security',330]]){
            const text=fs.readFileSync(`${process.env.RUNNER_TEMP}/vendor-results/${name}.log`,'utf8');
            const lines=text.split(String.fromCharCode(10)).map(l=>l.trim());
            for(const [key,value] of [['tests',count],['pass',count],['fail',0],['skipped',0]])
              assert.ok(lines.includes(`ℹ ${key} ${value}`)||lines.includes(`# ${key} ${value}`),`${name}: ${key} ${value} required`);
          }
          NODE
      - name: Pin the just-built image ID for offline runtime checks
        run: echo "DARKTRACE_IMAGE_ID=$(docker image inspect --format '{{.Id}}' darktrace-mcp:ci)" >> "$GITHUB_ENV"
      - name: Check image configuration has no ports or operator secrets
        run: |
          config_json="$(docker image inspect --format '{{json .Config}}' darktrace-mcp:ci)"
          node -e 'const assert=require("node:assert/strict");const c=JSON.parse(process.argv[1]);assert.equal(c.User,"1000:1000");assert.deepEqual(c.Entrypoint,["/nodejs/bin/node","/app/dist/src/index.js"]);assert.equal(c.ExposedPorts,undefined);const env=c.Env??[];assert.ok(!env.some(x=>/DARKTRACE_|TOKEN|PROXY|TLS_REJECT|SSL_CERT|OPENSSL_CONF/i.test(x)),"operator secrets or proxy/TLS overrides must not be baked into the image")' "$config_json"
      - name: Check help and version without network
        run: |
          docker run --pull=never --rm --log-driver=none --network=none --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=64 --memory=256m "$DARKTRACE_IMAGE_ID" --help
          expected_version="$(node -p 'require("./package.json").version')"
          actual_version="$(docker run --pull=never --rm --log-driver=none --network=none --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=64 --memory=256m "$DARKTRACE_IMAGE_ID" --version)"
          test "$actual_version" = "$expected_version"
      - name: Fail closed on actual shared OpenSSL and vendor Node
        run: |
          docker run --pull=never --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint node "$DARKTRACE_IMAGE_ID" \
            -e 'const a=require("node:assert/strict");a.equal(process.versions.node,"24.18.1");a.equal(process.config.variables.node_shared_openssl,true);const [major,minor,patch]=process.versions.openssl.split(".").map(Number);a.equal(major,3);a.equal(minor,5);a.ok(patch>=9);console.log(JSON.stringify({node:process.versions.node,openssl:process.versions.openssl,shared:process.config.variables.node_shared_openssl}))' > "$RUNNER_TEMP/vendor-results/final-runtime.json"
      - name: Verify nonroot root-owned runtime inventory
        run: |
          docker run --pull=never --rm --log-driver=none --network=none --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=64 --memory=256m --entrypoint node "$DARKTRACE_IMAGE_ID" \
            -e 'const assert=require("node:assert/strict");const fs=require("node:fs");assert.equal(process.getuid(),1000);const root="/app";assert.deepEqual(fs.readdirSync(root).sort(),["LICENSE","dist","node_modules","package.json"]);const pending=[root];while(pending.length){const p=pending.pop();const s=fs.lstatSync(p);assert.equal(s.uid,0,`${p} must be root-owned`);if(s.isDirectory())for(const n of fs.readdirSync(p))pending.push(`${p}/${n}`)}for(const p of ["/app/test","/app/src","/app/scripts","/app/docs","/app/openapi","/app/README.md","/app/SECURITY.md","/app/.env"])assert.equal(fs.existsSync(p),false,`${p} must not ship`);assert.equal(fs.statSync("/app/dist/src/index.js").uid,0)'
      - name: Check synthetic protected token files offline
        shell: bash
        run: |
          set -euo pipefail
          token_dir="$(mktemp -d)"
          trap 'rm -rf "$token_dir"' EXIT
          printf '%s\n' 'synthetic-public-token' > "$token_dir/public-token"
          printf '%s\n' 'synthetic-private-token' > "$token_dir/private-token"
          chmod 600 "$token_dir/public-token" "$token_dir/private-token"
          uid="$(id -u)"
          gid="$(id -g)"
          test "$uid" -ne 0
          docker run --pull=never --rm --log-driver=none --network=none --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=64 --memory=256m --user "$uid:$gid" \
            --mount "type=bind,src=$token_dir/public-token,dst=/run/secrets/public-token,readonly" \
            --mount "type=bind,src=$token_dir/private-token,dst=/run/secrets/private-token,readonly" \
            --env DARKTRACE_URL=https://darktrace.example.invalid \
            --env DARKTRACE_PUBLIC_TOKEN_FILE=/run/secrets/public-token \
            --env DARKTRACE_PRIVATE_TOKEN_FILE=/run/secrets/private-token \
            --env DARKTRACE_PROFILES=read --env DARKTRACE_SENSITIVE_READ=false \
            "$DARKTRACE_IMAGE_ID" --check-config > "$RUNNER_TEMP/darktrace-check-config.json"
          node -e 'const assert=require("node:assert/strict");const fs=require("node:fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));assert.deepEqual(Object.keys(x).sort(),["approval","labValidated","networkProbe","ok","profiles","registeredTools","transport"]);assert.equal(x.ok,true);assert.equal(x.transport,"stdio");assert.equal(x.registeredTools,27);assert.deepEqual(x.profiles,{read:true,sensitive:false,write:false,critical:false});assert.deepEqual(x.approval,{critical:"elicitation",write:"host"});assert.equal(x.networkProbe,false);assert.equal(x.labValidated,false)' "$RUNNER_TEMP/darktrace-check-config.json"
          rm -f "$RUNNER_TEMP/darktrace-check-config.json"
      - name: Verify SDK initialize and tool listing without network
        shell: bash
        run: |
          set -euo pipefail
          token_dir="$(mktemp -d)"
          smoke_dir="$RUNNER_TEMP/darktrace-docker-sdk-smoke"
          trap 'rm -rf "$token_dir" "$smoke_dir"' EXIT
          printf '%s\n' 'synthetic-public-token' > "$token_dir/public-token"
          printf '%s\n' 'synthetic-private-token' > "$token_dir/private-token"
          chmod 600 "$token_dir/public-token" "$token_dir/private-token"
          uid="$(id -u)"
          test "$uid" -ne 0
          mkdir -p "$smoke_dir"
          cp package.json package-lock.json npm-shrinkwrap.json "$smoke_dir/"
          # Active oracle: the full-API contract (five operator profiles). The first-stable
          # fixture stays pinned only as historical provenance in scripts/verify-release.mjs.
          cp test/security/fixtures/mcp-tool-contracts-full-api.json "$smoke_dir/contract.json"
          (
            cd "$smoke_dir"
            npm ci --ignore-scripts --no-audit --no-fund
          for smoke_profile in read read,sensitive read,write read,write,critical all; do
          export DARKTRACE_SMOKE_PROFILES="$smoke_profile"
          node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';
            import { randomUUID, createHash } from 'node:crypto';
            import { spawnSync } from 'node:child_process';
            import { chmodSync, mkdtempSync, rmSync, writeFileSync, readFileSync } from 'node:fs';
            import { tmpdir } from 'node:os';
            import { join } from 'node:path';
            import { Client } from '@modelcontextprotocol/client';
            import { StdioClientTransport } from '@modelcontextprotocol/client/stdio';

            const uid = process.getuid();
            const gid = process.getgid();
            assert.ok(uid > 0, 'Docker smoke must run as a nonroot host user');
            assert.ok(process.env.DARKTRACE_IMAGE_ID, 'built Docker image ID must be set');
            const tokenDir = mkdtempSync(join(tmpdir(), 'darktrace-docker-sdk-'));
            const containerName = `darktrace-sdk-smoke-${randomUUID()}`;
            const dockerArgs = [
              'run', '--pull=never', '--rm', '--name', containerName, '--log-driver=none',
              '--network=none', '--read-only', '--cap-drop=ALL', '--security-opt=no-new-privileges',
              '--pids-limit=64', '--memory=256m', '--user', `${uid}:${gid}`, '--init', '-i',
              '--mount', `type=bind,src=${join(tokenDir, 'public-token')},dst=/run/secrets/public-token,readonly`,
              '--mount', `type=bind,src=${join(tokenDir, 'private-token')},dst=/run/secrets/private-token,readonly`,
              '--env', 'DARKTRACE_URL=https://darktrace.example.invalid',
              '--env', 'DARKTRACE_PUBLIC_TOKEN_FILE=/run/secrets/public-token',
              '--env', 'DARKTRACE_PRIVATE_TOKEN_FILE=/run/secrets/private-token',
              '--env', `DARKTRACE_PROFILES=${process.env.DARKTRACE_SMOKE_PROFILES}`,
              process.env.DARKTRACE_IMAGE_ID,
            ];
            const client = new Client({ name: 'darktrace-docker-smoke', version: '1.0.0' });
            const transport = new StdioClientTransport({
              command: 'docker',
              args: dockerArgs,
              env: { PATH: process.env.PATH ?? '/usr/bin:/bin' },
              stderr: 'ignore',
              cwd: process.cwd(),
            });
            let deadline;

            function exactContainerExists() {
              const result = spawnSync('docker', ['ps', '-aq', '--filter', `name=^/${containerName}$`], { encoding: 'utf8' });
              assert.equal(result.status, 0, result.stderr);
              return result.stdout.trim().length > 0;
            }

            try {
              for (const [name, value] of [['public-token', 'synthetic-public-token'], ['private-token', 'synthetic-private-token']]) {
                const file = join(tokenDir, name);
                writeFileSync(file, `${value}\n`, { mode: 0o600 });
                chmodSync(file, 0o600);
              }

              const timeout = new Promise((_, reject) => {
                deadline = setTimeout(() => reject(new Error('SDK Docker smoke timed out')), 30000);
                deadline.unref();
              });
              const listing = client.connect(transport).then(() => client.listTools());
              const { tools } = await Promise.race([listing, timeout]);
              assert.ok(Array.isArray(tools), 'SDK listTools must return an array');
              const fixtureBytes=readFileSync('contract.json');
              assert.equal(createHash('sha256').update(fixtureBytes).digest('hex'),'c95104ced1955b7a1bdc72a6e19bc79c3d1a3e0ee39114e7eabf7fa71545fd3b');
              const fixture=JSON.parse(fixtureBytes);
              const shapes={
                read:{profile:'read',tools:27,hash:'afeb056eb4e1830462256436948ceaa706601d14ade6ebc7f36ab00cda011964',flags:{read:true,sensitive:false,write:false,critical:false}},
                'read,sensitive':{profile:'read+sensitive',tools:36,hash:'ca4ebd6b4d640aae3571ad3d68e18bd489ae39f02b980188a554dfb989462d6a',flags:{read:true,sensitive:true,write:false,critical:false}},
                'read,write':{profile:'read+write',tools:36,hash:'9d55533f6fff2982f3aa0414687a259c1d042cc7aa267a0106126a4ea7d4e39b',flags:{read:true,sensitive:false,write:true,critical:false}},
                'read,write,critical':{profile:'read+write+critical',tools:42,hash:'f22cee1aefb944c8be6b683f251951a965d9d94dd0b9ff872a5c06cc69bd062b',flags:{read:true,sensitive:false,write:true,critical:true}},
                all:{profile:'all',tools:51,hash:'b377eac60a2eed8233d8481b0b69074e79eac6a537b8e1b4ec1e47a5b2abf859',flags:{read:true,sensitive:true,write:true,critical:true}},
              };
              const shape=shapes[process.env.DARKTRACE_SMOKE_PROFILES];
              assert.ok(shape,'unknown smoke profile');
              const profile=shape.profile;
              assert.equal(tools.length,shape.tools);
              const captured=tools.map(({name,description,inputSchema,annotations})=>({name,description,inputSchema,annotations}));
              assert.deepEqual(captured,fixture.contracts[profile].tools);
              function canonical(v){if(Array.isArray(v))return v.map(canonical);if(v&&typeof v==='object')return Object.fromEntries(Object.keys(v).sort().map(k=>[k,canonical(v[k])]));return v;}
              const hash=createHash('sha256').update(JSON.stringify(canonical(captured))).digest('hex');
              assert.equal(hash,shape.hash);assert.equal(hash,fixture.contracts[profile].sha256);
              const offlineRun=(extra,mode)=>{
                const args=dockerArgs.slice(0,-1);
                args.splice(args.indexOf('--name'),2);
                args.push(...extra.flatMap(x=>['--env',x]),process.env.DARKTRACE_IMAGE_ID,...mode);
                const r=spawnSync('docker',args,{encoding:'utf8',timeout:30000});
                assert.equal(r.error,undefined);
                assert.ok(!/synthetic-public-token|synthetic-private-token/.test(r.stdout+r.stderr));
                return r;
              };
              // Every supported profile, write and critical included, must start and report itself offline.
              for(const mode of [['doctor'],['--check-config']]){
                const r=offlineRun([],mode);
                assert.equal(r.status,0,r.stderr);
                const x=JSON.parse(r.stdout);
                assert.equal(x.ok,true);assert.equal(x.transport,'stdio');assert.equal(x.registeredTools,shape.tools);
                assert.deepEqual(x.profiles,shape.flags);assert.equal(x.networkProbe,false);assert.equal(x.labValidated,false);
              }
              if(profile==='read'){
                // Only critical without write is a startup error, in every production mode.
                const denials=[];
                for(const extra of [['DARKTRACE_WRITE_CRITICAL=true'],['DARKTRACE_PROFILES=read,critical'],['DARKTRACE_PROFILES=read,sensitive,critical']])for(const mode of [[],['doctor'],['--check-config']]){
                  const r=offlineRun(extra,mode);
                  assert.equal(r.status,1);assert.equal(r.stdout,'');
                  assert.equal(JSON.parse(r.stderr).event,'startup_error');
                  denials.push({extra,mode,exit:r.status});
                }
                writeFileSync(`${process.env.RUNNER_TEMP}/vendor-results/critical-without-write-refusals.json`,JSON.stringify(denials,null,2));
              }
              writeFileSync(`${process.env.RUNNER_TEMP}/vendor-results/sdk-${profile}.json`,JSON.stringify({image:process.env.DARKTRACE_IMAGE_ID,profile,tools:shape.tools,contractHash:hash,exactFixture:true,noApiCalls:true}));
            } finally {
              clearTimeout(deadline);
              try { await client.close(); } catch {}
              try { await transport.close(); } catch {}
              try {
                if (exactContainerExists()) {
                  const removed = spawnSync('docker', ['rm', '--force', containerName], { encoding: 'utf8' });
                  assert.equal(removed.status, 0, removed.stderr);
                  throw new Error('SDK smoke left its exact test container behind; it was removed');
                }
              } finally {
                rmSync(tokenDir, { recursive: true, force: true });
              }
            }
          NODE
          done
          )
      - name: Bind final production bytes to vendor gate build
        shell: bash
        run: |
          set -euo pipefail
          docker run --pull=never --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint node "$DARKTRACE_IMAGE_ID" \
            -e 'const f=require("node:fs"),c=require("node:crypto");function hashes(d,p=""){const out={};for(const e of f.readdirSync(d,{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name))){const n=p+e.name;if(e.isDirectory())Object.assign(out,hashes(d+"/"+e.name,n+"/"));else if(e.isFile())out[n]=c.createHash("sha256").update(f.readFileSync(d+"/"+e.name)).digest("hex")}return out}console.log(JSON.stringify(hashes("/app/dist/src")))' > "$RUNNER_TEMP/vendor-results/final-runtime-hashes.json"
          # These pins bind src/ (sourceTreeSha256), the security subcase count and the built
          # dist/src runtime. Recompute them after merging other branches (for example changes to
          # src/index.ts or new src/cli/* files): run `npm run test:security`, then from its receipt
          # take sourceTreeSha256, subcases.length, Object.keys(runtimeHashes).length and
          # sha256(JSON.stringify(runtimeHashes)).
          node --input-type=commonjs <<'NODE'
          const a=require('node:assert/strict'),f=require('node:fs'),c=require('node:crypto'),p=`${process.env.RUNNER_TEMP}/vendor-results`;
          const names=f.readdirSync(`${p}/security-evidence`).filter(n=>n.endsWith('.json'));
          a.equal(names.length,1,'Exactly one fresh security receipt is required');
          const r=JSON.parse(f.readFileSync(`${p}/security-evidence/${names[0]}`));
          a.equal(r.sourceTreeSha256,'099c3244a455353ac2b9b467e0380d3578cbefa5366a157c8eaae82bb44f9125');
          a.equal(r.receiptComplete,true);a.equal(r.tests.status,0);a.equal(r.subcases.length,330);
          const actual=JSON.parse(f.readFileSync(`${p}/final-runtime-hashes.json`));
          a.deepEqual(actual,r.runtimeHashes);a.equal(Object.keys(actual).length,53);
          a.equal(c.createHash('sha256').update(JSON.stringify(actual)).digest('hex'),'99e8fdcdf437e583f6697a7810115114ba1505d27d5f129deabe26be36a454f9');
          a.equal(r.fixtureHashes['mcp-tool-contracts-full-api.json'],'c95104ced1955b7a1bdc72a6e19bc79c3d1a3e0ee39114e7eabf7fa71545fd3b');
          a.equal(r.fixtureHashes['mcp-tool-contracts-first-stable.json'],'6ddda2054c9c708d0516a90b7811eb0aba565016403953dace89d47bc89d213c');
          f.writeFileSync(`${p}/byte-binding.json`,JSON.stringify({sourceTreeSha256:r.sourceTreeSha256,runtimeTreeSha256:c.createHash('sha256').update(JSON.stringify(actual)).digest('hex'),runtimeFiles:53,fixtureSha256:r.fixtureHashes['mcp-tool-contracts-full-api.json'],historicalFirstStableFixtureSha256:r.fixtureHashes['mcp-tool-contracts-first-stable.json']},null,2));
          NODE
      - name: Archive signed inputs and complete native gate receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: patched-runtime-${{ matrix.arch }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/runtime-inputs
            ${{ runner.temp }}/runtime-inputs-fetch.log
            ${{ runner.temp }}/vendor-results
