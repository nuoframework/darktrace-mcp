    Components:
      type: object
      properties:
        cid:
          type: integer
          format: int64
          description: The "component id". A unique identifier.
          example: 4650
        chid:
          type: integer
          format: int64
          description: The "component history id". Increments when the component is edited.
          example: 6664
        mlid:
          type: integer
          format: int64
          description: The 'metric logic id' for the metric used in the component.
          example: 232
        threshold:
          type: integer
          format: int64
          description: The threshold value that the size must exceed for the component to trigger.
          example: 1
        interval:
          type: integer
          format: int64
          description: The timeframe in seconds within which the threshold must be satisfied.
          example: 7200
        logic:
          type: object
          description: An object describing the component logic.
          properties:
            data:
              type: object
              description: An object representing the logical relationship between component filters. Each filter is given
                an alphabetical reference and the contents of this object describe the relationship between those objects.
              properties:
                left:
                  type: object
                  description: Objects on the left will be compared with the object on the right using the specified operator.
                operator:
                  type: string
                  description: A logical operator to compare filters with.
                  example: OR
                right:
                  type: object
                  description: Objects on the left will be compared with the object on the right using the specified operator.
            version:
              type: string
              description: The version of the component logic.
              example: v0.1
        filters:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: A filter that is used in the component logic. All filters are given alphabetical identifiers.
                  Display filters - those that appear in the model alert notification - can be identified by a lowercase 'd'
                  and a numeral.
                example: A
              cfid:
                type: number
                description: The 'component filter id'. A unique identifier for the filter as part of a the component.
                example: 34019.0
              cfhid:
                type: number
                description: The "component filter history id". Increments when the filter is edited.
                example: 46783.0
              filtertype:
                type: string
                description: The filtertype that is used in the filter. A full list of filtertypes can be found on the /filtertypes
                  endpoint.
                example: Message
              comparator:
                type: string
                description: The comparator. A full list of comparators available for each filtertype can be found on the
                  /filtertypes endpoint.
                example: matches regular expression
              arguments:
                type: object
                description: An object containing the value to be compared. Display filters will have an empty object.
                properties:
                  value:
                    type: string
                    description: Compromise
                    example: (Anomalous
          description: The filters that comprise the component.
        active:
          type: boolean
          description: Whether the component is currently active as part of a model.
          example: true
      title: /components — Response Schema
      description: 'Fuente: https://customerportal.darktrace.com/guides/api-components-schema'
    Cves:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              did:
                type: integer
                format: int64
                description: A unique identifier of a device in the Darktrace system.
                example: 186
              platform mappings (CPEs):
                type: array
                items:
                  type: object
                  properties:
                    vendor:
                      type: string
                      description: The vendor of the device that the CPE corresponds to.
                      example: rockwellautomation
                    product:
                      type: string
                      description: The product (CPE) that has been matched. Some CVEs may be matched by product and firmware
                        version (CPE "bmxp342020h_firmware") while other CVEs apply to the whole PLC family in general (CPE
                        "bmxp342020")
                      example: compactlogix_1769-l16er-bb1b
                    version:
                      type: string
                      description: The product version the CVEs are applicable to.
                      example: All
                    patch:
                      type: string
                      description: If a patch is available for the CVE, what software version is required to mitigate.
                      example: To mitigate, update to a version greater than 2.2
                    cves:
                      type: array
                      items:
                        type: object
                        properties:
                          LAST_MODIFIED_DATE:
                            type: string
                            description: The date that the CVE was last updated.
                            example: 09/10/2019
                          CVE_ID:
                            type: string
                            description: The ID of a CVE matched to the device by this CPE.
                            example: CVE-2016-2279
                          BASE_SEVERITY:
                            type: string
                            description: The base severity of the CVE, as denoted by NIST.
                            example: Medium
                          DESCRIPTION:
                            type: string
                            description: The description of the CVE, as provided by NIST.
                            example: Cross-site scripting (XSS) vulnerability in the web server in Rockwell Automation Allen-Bradley
                              CompactLogix 1769-L* before 28.011+ allows remote attackers to inject arbitrary web script or
                              HTML via unspecified vectors.
                      description: An array of the specific CVEs matched to that device by CPE.
                    applies to:
                      type: array
                      items: {}
                      description: An array of the CVE ID for all CVEs matched by this CPE.
                description: An array of CVEs matched to the device, grouped by CPE. Some CVEs may be matched by multiple
                  corresponding CPEs.
              cves:
                type: array
                items:
                  type: object
                  properties:
                    LAST_MODIFIED_DATE:
                      type: string
                      description: The date that the CVE was last updated.
                      example: '2019-10-09'
                    CVE_ID:
                      type: string
                      description: The ID of a CVE matched to the device by this CPE.
                      example: CVE-2016-2279
                    BASE_SEVERITY:
                      type: string
                      description: The base severity of the CVE, as denoted by NIST.
                      example: Medium
                    DESCRIPTION:
                      type: string
                      description: The description of the CVE, as provided by NIST.
                      example: Cross-site scripting (XSS) vulnerability in the web server in Rockwell Automation Allen-Bradley
                        CompactLogix 1769-L* before 28.011+ allows remote attackers to inject arbitrary web script or HTML
                        via unspecified vectors.
                description: An array of all CVEs that were successfully matched to the device.
          description: An array of devices and the CVEs associated with those devices.
      title: /cves — Response Schema
      description: 'Fuente: https://customerportal.darktrace.com/guides/api-cves-schema'
    DetailsEventtypeConnection:
      type: object
      properties:
        time:
          type: string
          description: The timestamp when the record was created in epoch time.
          example: '2020-04-15 08:00:00'
        timems:
          type: integer
          format: int64
          description: The timestamp when the record was created in readable format.
          example: 1586937600000
        action:
          type: string
          description: The action associated with the device that has generated this record.
          example: connection
        eventType:
          type: string
          description: The event type.
          example: connection
        uid:
          type: string
          description: A unique identifier for the connection - can be entered into Advanced Search or the omnisearch bar
            to locate associated connections.
          example: VGBIDXXfTVFPww1d
        status:
          type: string
          description: Can contain "failed" for failed connections or "ongoing" for continued connections. Completed connections
            will not return this field.
          example: ongoing
        proxyPort:
          type: number
          description: If a proxy was detected - the port used.
          example: 3128.0
        sdid:
          type: number
          description: The device id of the source device. Will only appear if the source device has been observed by Darktrace.
          example: 29.0
        ddid:
          type: number
          description: The device id of the destination device. Will only appear if the destination device has been observed
            by Darktrace.
          example: 3765.0
        port:
          type: integer
          format: int64
          description: In the majority of cases, the destination port connected to.
          example: 443
        sourcePort:
          type: number
          description: The port connected from on the source device.
          example: 22.0
        destinationPort:
          type: number
          description: The port connected to on the destination device.
          example: 443.0
        direction:
          type: string
          description: The direction of the connection.
          example: out
        applicationprotocol:
          type: string
          description: The application protocol used in the connection as derived by Darktrace.
          example: HTTPS
        protocol:
          type: string
          description: The network protocol used for the connection as derived by Darktrace.
          example: TCP
        sourceDevice:
          type: object
          description: An object describing the source device. There are multiple formats this may take, please see the separate
            sourceDevice object schemas.
        destinationDevice:
          type: object
          description: An object describing the destination device. There are multiple formats this may take, please see the
            separate destinationDevice object schemas.
        proxyDevice:
          type: object
          description: If a proxy was detected - an object describing the proxy.
          properties:
            ip:
              type: string
              description: If a proxy was detected - the proxy IP.
              example: 10.0.18.224
        source:
          type: string
          description: The hostname or IP of the source device.
          example: ws173
        destination:
          type: string
          description: The hostname or IP of the destination device.
          example: google.com
        proxy:
          type: string
          description: If a proxy was detected - the proxy IP.
          example: 192.168.72.4
