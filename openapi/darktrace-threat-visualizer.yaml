        probes:
          type: object
          description: An object describing any probes, whether physical or virtualized.
          properties:
            '12':
              type: object
              description: An object describing a specific probe. Probe objects are identified by the numeric ID.
              properties:
                id:
                  type: number
                  description: The numeric probe ID.
                  example: 12.0
                uuid:
                  type: string
                  description: A unique identifier for the instance.
                  example: 6b3ed6f4-1823-4028-b9a5-9ea9ec3ec70b
                version:
                  type: string
                  description: The probe software version currently installed.
                  example: 6.1.23 (f35936c6))
                bundleVersion:
                  type: string
                  example: 6.1.7
                bundleDate:
                  type: string
                  example: '2023-12-13 12:23:25'
                bundleInstalledDate:
                  type: string
                  example: '2023-12-14 06:24:46'
                configuredServer:
                  type: string
                  description: The endpoint at which the Darktrace instance contacts the probe.
                  example: example-vsensor-2.example.com
                ipAddress:
                  type: string
                  description: The probe IP address. May differ from the configuredServer field depending on the probe type.
                  example: 10.10.12.12
                label:
                  type: string
                  description: A descriptive label provided for the probe.
                  example: Testing 2019
                hostname:
                  type: string
                  description: The probe hostname if applicable/ known.
                  example: testprobe1
                time:
                  type: string
                  description: The current server time on the probe.
                  example: 2024-01-05 14:44
                metadata:
                  type: object
                  description: For compatible probe types and software versions, this object will include metadata about the
                    vSensor location in AWS including VPC and region information. Otherwise, null
                type:
                  type: string
                  description: The type of probe.
                  example: vSensor
                load:
                  type: number
                  description: This percentage value indicates how in-demand resources are in the probe processing.
                  example: 14.0
                cpu:
                  type: number
                  description: This percentage value indicates the average amount of CPU usage (not idle) on the probe.
                  example: 0.0
                memoryUsed:
                  type: number
                  description: The percentage of memory in use on the probe.
                  example: 16.0
                osSensors:
                  type: array
                  items: {}
                  description: An array of IP addresses of one or more associated osSensors. Only relevant for vSensor-type
                    probes.
                antigenaNetworkBlockedConnections:
                  type: object
                  description: An object representing Darktrace ⁄ NETWORK Autonomous Response attempts to end connections
                    and number of those attempts where connectivity demonstrably continued. These fields are experimental
                    and under active development, and should not be relied upon, or expected to remain stable, at the current
                    time.
                  properties:
                    attempted:
                      type: number
                      description: The culmulative number of attempts made to end connections (fired RSTs) taken by Darktrace
                        ⁄ NETWORK Autonomous Response on the given instance since it was upgraded to a software version where
                        this value was recorded. One Darktrace ⁄ NETWORK action will produce multiple attempts, as attempts
                        are recorded on a per-RST basis. This metric is experimental and under active development.
                      example: 1335.0
                    failed:
                      type: number
                      description: Attempts where Darktrace ⁄ NETWORK Autonomous Response has attempted to end a connection
                        - and the associated RST packet was seen by the instance - but connectivity demonstrably continued
                        after the RST was sent and/or observed. This metric is experimental and under active development.
                      example: 12.0
                osPacketsProcessed:
                  type: string
                  description: The number of packets processed from child osSensors on this parent probe.
                  example: '377634'
                networkInterfacesState_eth0:
                  type: string
                  description: Whether the network interface is up or down on the probe.
                  example: up
                networkInterfacesAddress_eth0:
                  type: string
                  description: The IP addresses if resolvable of the probe network interface.
                  example: 10.10.12.12
                networkInterfacesReceived_eth0:
                  type: number
                  description: The number of bytes received by the interface on the probe.
                  example: 559588000000.0
                networkInterfacesTransmitted_eth0:
                  type: number
                  description: The number of bytes sent by the interface on the probe.
                  example: 39866733296.0
                bandwidthCurrent:
                  type: number
                  description: Bandwidth ingested by the probe over the last 10 minutes. Some bandwidth may not be processed
                    due to system settings.
                  example: 1720840.0
                bandwidthCurrentString:
                  type: string
                  description: Bandwidth ingested by the probe over the last 10 minutes in a readable format. Some bandwidth
                    may not be processed due to system settings.
                  example: 1.72 Mbps
                bandwidthAverage:
                  type: number
                  description: Average bandwidth ingested by the probe over the last 2 weeks. Some bandwidth may not be processed
                    due to system settings.
                  example: 0.0
                bandwidthAverageString:
                  type: string
                  description: Average bandwidth ingested by the probe over the last 2 weeks in a readable format. Some bandwidth
                    may not be processed due to system settings.
                  example: 0 kbps
                bandwidth7DayPeak:
                  type: number
                  description: The highest bandwidth ingested by the probe observed in any ten-minute interval over the last
                    7 days. Some bandwidth may not be processed due to system settings.
                  example: 0.0
                bandwidth7DayPeakString:
                  type: string
                  description: The highest bandwidth ingested by the probe observed in any ten-minute interval over the last
                    7 days in a readable format. Some bandwidth may not be processed due to system settings.
                  example: 0 kbps
                bandwidth2WeekPeak:
                  type: number
                  description: The highest bandwidth ingested by the probe observed in any ten-minute interval over the last
                    2 weeks. Some bandwidth may not be processed due to system settings.
                  example: 0.0
                bandwidth2WeekPeakString:
                  type: string
                  description: The highest bandwidth ingested by the probe observed in any ten-minute interval over the last
                    2 weeks in a readable format. Some bandwidth may not be processed due to system settings.
                  example: 0 kbps
                processedBandwidthCurrent:
                  type: number
                  description: Bandwidth processed by the probe over the last 10 minutes.
                  example: 1720840.0
                processedBandwidthCurrentString:
                  type: string
                  description: Bandwidth processed by the probe over the last 10 minutes in a readable format.
                  example: 1.72 Mbps
                processedBandwidthAverage:
                  type: number
                  description: Average bandwidth processed by the probe over the last 2 weeks.
                  example: 1041910.0
                processedBandwidthAverageString:
                  type: string
                  description: Average bandwidth processed by the probe over the last 2 weeks in a readable format.
                  example: 1.04 Mbps
                processedBandwidth7DayPeak:
                  type: number
                  description: The highest bandwidth processed by the probe observed in any ten-minute interval over the last
                    7 days.
                  example: 32829661.0
                processedBandwidth7DayPeakString:
                  type: string
                  description: The highest bandwidth processed by the probe observed in any ten-minute interval over the last
                    7 days in a readable format.
                  example: 32.83 Mbps
                processedBandwidth2WeekPeak:
                  type: number
                  description: The highest bandwidth processed by the probe observed in any ten-minute interval over the last
                    2 weeks.
                  example: 32829661.0
                processedBandwidth2WeekPeakString:
                  type: string
                  description: The highest bandwidth processed by the probe observed in any ten-minute interval over the last
                    2 weeks in a readable format.
                  example: 32.83 Mbps
                connectionsPerMinuteCurrent:
                  type: number
                  description: Current number of connections processed by the probe in the last minute - includes ongoing
                    (unfinished) connections and completed connections.
                  example: 331.0
                connectionsPerMinuteAverage:
                  type: number
                  description: Average number of connections processed by the probe per minute in the last 2 weeks - includes
                    ongoing (unfinished) connections and completed connections.
                  example: 326.0
                connectionsPerMinute7DayPeak:
                  type: number
                  description: Highest number of connections processed by the probe per minute in the last 7 days - includes
                    ongoing (unfinished) connections and completed connections.
                  example: 752.0
                connectionsPerMinute2WeekPeak:
                  type: number
                  description: Highest number of connections processed by the probe per minute in the last 2 weeks - includes
                    ongoing (unfinished) connections and completed connections.
                  example: 752.0
            '13':
              type: object
              description: An additional example of a probe object - here, an errored probe.
              properties:
                configuredServer:
                  type: string
                  description: The IP or hostname at which the master instance will attempt to contact the probe.
                  example: 10.15.3.39
                ipAddress:
                  type: string
                  description: The probe IP address. May differ from the configuredServer field depending on the probe type.
                  example: 10.15.3.39
                label:
                  type: string
                  description: A descriptive label provided for the probe.
                  example: Testing 2020
                error:
                  type: boolean
                  description: Whether the probe is experiencing an error, such as being uncontactable by the master instance.
                    This field will only appear under specific circumstances.
                  example: true
                lastContact:
                  type: string
                  description: The last time the probe was contactable by the master instance.
                  example: '2023-02-06 02:30:00'
