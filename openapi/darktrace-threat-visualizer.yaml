        description: Start time of data to return in millisecond format, relative to midnight January 1st 1970 UTC.
        schema:
          type: integer
          format: int64
      - name: to
        in: query
        required: false
        description: End time of data to return in YYYY-MM-DD HH:MM:SS format.
        schema:
          type: string
      - name: viewsubnet
        in: query
        required: false
        description: Takes an sid value to focus on a specific subnet.
        schema:
          type: integer
          format: int64
      - name: responsedata
        in: query
        required: false
        description: When given the name of a top-level field or object, restricts the returned JSON to only that field or
          object.
        schema:
          type: string
      responses:
        '200':
          description: 'OK. Variantes de respuesta documentadas según parámetros: `NetworkDidFulldevicedetailsFalse` (Response
            Schema - did - fulldevicedetails=false), `NetworkDidFulldevicedetailsTrue` (Response Schema - did - fulldevicedetails=true),
            `NetworkDidAndIntextExternalFulldevicedetailsFalse` (Response Schema - did and intext=external - fulldevicedetails=false),
            `NetworkDidAndIntextExternalFulldevicedetailsTrue` (Response Schema - did and intext=external - fulldevicedetails=true),
            `NetworkViewsubnet` (Response Schema = viewsubnet)'
          content:
