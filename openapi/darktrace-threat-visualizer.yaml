  /devicesearch:
    get:
      tags:
      - devicesearch
      summary: GET /devicesearch
      operationId: get_devicesearch
      description: 'The /devicesearch endpoint provides a highly filterable search capacity to interrogate the list of devices
        Darktrace has seen on the network. It is more suited for inventory management and general queries than the /devices
        endpoint as it provides sorting and string searching capabilities.


        **Notas (doc oficial):** The query parameter can take a string directly to search all key/value pairs (.e.g query="value"
        ) or be limited to a certain data type (.e.g query=label:"test" ). Wildcards (*) are supported. Multiple queries can
        be space-separated, for example query=tag:"*T*" label:"Test" or query=type:"laptop" type:"desktop" . Repeated field
        filters are treated as "or".  The space must be percent-encoded when making the final request but not when producing
        the signature. The priority field will not be included in the response for a device if the value is 0. Returned data
        can be paginated by limiting the count value and making multiple requests, incrementing the offset value by the count
        value each time (e.g., count=50 , multiple queries for offset=0, offset=50, offset=100 ). This is necessary for requests
        which return greater than 300 values. The default time frame is four weeks (28 days). This can be altered with the
        seensince parameter.


        **Permiso mínimo (GET):** Visualizer and Unrestricted Devices


        Documentación: https://customerportal.darktrace.com/guides/api-devicesearch-request'
      parameters:
      - name: count
        in: query
        required: false
        description: The number of devices to return. If unspecified, defaults to 100. Maximum value is 300.
        schema:
          type: integer
          format: int64
      - name: orderBy
        in: query
        required: false
        description: Orders the response by the specified filter, default value is lastSeen . Valid values are priority ,
          hostname , ip , macaddress , vendor , os , firstSeen , lastSeen , devicelabel or typelabel .
        schema:
          type: string
      - name: order
        in: query
        required: false
        description: Sets the sort order for returned devices as ascending or descending, can take asc or desc . Default is
          ascending.
        schema:
          type: string
      - name: query
        in: query
        required: false
        description: An optional string search. Can query all fields or take a specific field filter from label , tag , type
          , hostname , ip , mac , vendor and os .
        schema:
          type: string
      - name: offset
        in: query
        required: false
        description: An offset for the results returned.
        schema:
          type: integer
          format: int64
      - name: responsedata
        in: query
        required: false
        description: When given the name of a top-level field or object, restricts the returned JSON to only that field or
          object.
        schema:
          type: string
      - name: seensince
        in: query
        required: false
        description: Relative offset for activity. Devices with activity in the specified time period are returned. The format
          is either a number representing a number of seconds before the current time, or a number with a modifier such as
          second, minute, hour day or week (Minimum=1 second).
        schema:
          type: string
      responses:
        '200':
          description: 'OK. Variantes de respuesta documentadas según parámetros: `DevicesearchNetworkDevice` (Response Schema
            - Network Device), `DevicesearchDarktraceIDENTITYUserEntity` (Response Schema - Darktrace ⁄ IDENTITY User Entity)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicesearchNetworkDevice'
        '400':
          description: Petición inválida (p. ej. INPUT ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Firma, token o fecha (DTAPI-Date) inválidos
        '403':
          description: El usuario del token no tiene el permiso requerido
