        content:
          application/json:
            schema:
              type: object
              required:
              - did
              - action
              - duration
              properties:
                did:
                  type: integer
                  format: int64
                  description: Identification number of a device modelled in the Darktrace system.
                action:
                  type: string
                  enum:
                  - connection
                  - pol
                  - gpol
                  - quarantine
                  - quarantineOutgoing
                  - quarantineIncoming
                  description: connection=Block Matching Connections, pol=Enforce pattern of life, gpol=Enforce group pattern
                    of life, quarantine=Quarantine device, quarantineOutgoing=Block all outgoing traffic, quarantineIncoming=Block
                    all incoming traffic.
                duration:
                  type: integer
                  description: The duration of the action in seconds.
                reason:
                  type: string
                  description: free text field to specify the action purpose.
                connections:
                  type: array
                  description: Only valid for the connection action type.
                  items:
                    type: object
                    required:
                    - src
                    - dst
                    properties:
                      src:
                        type: string
                      dst:
                        type: string
                      port:
                        type: integer
