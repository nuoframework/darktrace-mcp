          description: A system field.
          example: 9999960.0
      title: /metrics — Response Schema
      description: 'Fuente: https://customerportal.darktrace.com/guides/api-metrics-schema'
    Models:
      type: object
      properties:
        name:
          type: string
          description: The name of the model.
          example: Anomalous File::Anomalous Octet Stream
        pid:
          type: integer
          format: int64
          description: The "policy id" of the model.
          example: 12
        phid:
          type: integer
          format: int64
          description: The model "policy history" id. Increments when the model is modified.
          example: 2842
        uuid:
          type: string
          description: A unique ID that is generated on creation of the model.
          example: 80010119-6d7f-0000-0305-5e0000000420
        logic:
          type: object
          description: A data structure that describes the conditions to bring about a model alert.
          properties:
            data:
              type: array
              items: {}
              description: If the model is a checklist type this will be a list of component ID numbers. If this model is
                a weighted type this will be a list of component ID, weight object pairs.
            type:
              type: string
              description: The type of model.
              example: componentList
            version:
              type: number
              description: A number representing the version of model logic.
              example: 1.0
        throttle:
          type: integer
          format: int64
          description: For an individual device, this is the value in seconds for which this model will not fire again.
          example: 3600
        sharedEndpoints:
          type: boolean
          description: For models that contain multiple components that reference an endpoint, this value indicates whether
            all endpoints should be identical for the model to fire.
          example: false
        actions:
          type: object
          description: The action to perform as a result of matching this model firing.
          properties:
            alert:
              type: boolean
              description: If true, an alert turned on will be pushed out to external systems if conditions for such alerting
                are met.
              example: true
            antigena:
              type: object
              description: An object containing the Darktrace Autonomous Response to be applied as a result of the model triggering
                a model alert.
            breach:
              type: boolean
              description: If true, generates a model alert that will appear in the threat tray.
              example: true
            model:
              type: boolean
              description: If true, creates an event in the device's event log without creating an alert/ model alert in the
                threat tray.
              example: true
            setPriority:
              type: boolean
              description: If no priority change action, a false boolean. If the priority is to be changed as a result of
                a model alert, the numeric value it should become.
              example: false
            setTag:
              type: boolean
              description: If no tag action, a false boolean. If a tag is to be applied as a result of a model alert, a single
                number or array of the system ID for the tag(s) to be applied.
              example: false
            setType:
              type: boolean
              description: If no change device type action is applied to the model, a false boolean. If a change device type
                action is to be applied as a result of a model alert, the numeric system ID for the label to be applied.
              example: false
        tags:
          type: array
          items: {}
          description: DNS Server
        interval:
          type: integer
          format: int64
          description: Where a model contains multiple components, this interval represents the time window in seconds in
            which all the components should fire for this model to be triggered.
          example: 0
        delay:
          type: number
          description: Minimum delay in seconds after a positive-scoring component has fired before the overall model score
            is calculated.
          example: 0.0
        sequenced:
          type: boolean
          description: Whether the components are required to fire in the specified order for the model alert to occur.
          example: false
        active:
          type: boolean
          description: Whether the model is enabled or disabled.
          example: true
        modified:
          type: string
          description: The time in UTC at which the model was last modified.
          example: '2023-08-15 12:27:32'
        activeTimes:
          type: object
          description: An object describing device whitelisting or blacklisting configured for this model.
          properties:
            devices:
              type: object
              description: The device ids for devices on the list.
            tags:
              type: object
              description: A system field.
            type:
              type: string
              description: 'The type of list: "restrictions" indicates a blacklist, "exclusions" a whitelist.'
              example: exclusions
            version:
              type: number
              description: A system field.
              example: 2.0
        autoUpdatable:
          type: boolean
          description: Whether the model is suitable for auto update.
          example: false
        autoUpdate:
          type: boolean
          description: Whether the model is enabled for auto update.
          example: true
        autoSuppress:
          type: boolean
          description: Whether the model will automatically be suppressed in the case of over-triggering.
          example: true
        description:
          type: string
          description: The optional description of the model.
          example: 'A device has downloaded a rare data stream which is not specifying a specific data type.\n\nAction: Investigate
            the endpoint the data is being sent from and consider downloading a PCAP or reviewing the hash if you believe
            the endpoint to be untrustworthy.'
        behaviour:
          type: string
          description: The score modulation function as set in the editor.
          example: decreasing
        defeats:
          type: array
          items:
            type: object
            properties:
              arguments:
                type: object
                description: An object describing the value the defeat condition is compared against.
                properties:
                  value:
                    type: string
                    description: An example value that the defeat condition is compared against.
                    example: '6'
              comparator:
                type: string
                description: The comparator used to compare the filter type to the value to form the defeat.
                example: is
              defeatID:
                description: An id for the defeat within the context of the model. If defeats are conditional, their id will
                  indicate the relationship - e.g., a condition for defeat with id 1 will have ID 1-1 . In this case, the
                  id will be a string.
              filtertype:
                type: string
                description: The filter used to form the defeat.
                example: Internal source device type
          description: An array of defeats applied to the model. Defeats do not impact model auto-update eligibility. The
            relationship between defeats is AND. Within the array, single defeats appear as objects, conditional defeats appear
            as arrays of multiple defeat objects.
        created:
          type: object
          description: An object describing the creation of the model.
          properties:
            by:
              type: string
              description: Username that created the model.
              example: smartinez_admin
        edited:
          type: object
          description: User ID that created the model.
          properties:
            by:
              type: string
              description: Username that last edited the model.
              example: ajohnston
            userID:
              type: number
              description: User ID that last edited the model.
              example: 24.0
        history:
          type: array
          items:
            type: object
            properties:
              modified:
                type: string
                description: The last modified date in UTC.
                example: '2019-11-15 11:42:00'
              active:
                type: boolean
                description: Whether the model was enabled or disabled at the time.
                example: true
              message:
                type: string
                description: The most recent commit message for the model.
                example: Improved rarity filters
              by:
                type: string
                description: The user who made the change.
                example: ajohnston
              phid:
                type: integer
                format: int64
                description: The "policy history id" at that change.
                example: 2842
              defeatsOnly:
                type: boolean
                description: If the changes made did not alter the model's autoupdate eligibility, will be true . This includes
                  changes to defeats, model priority, etc. Please refer to the model update guidance for more information.
                example: true
              accepted:
                type: string
                description: In epoch time, when the model update was accepted.
                example: '1686578003000'
              acceptedby:
                type: string
                description: The user who accepted the model update. Autoupdated models will display "System" in this field.
                example: ajohnston
          description: An object describing the edit history of the model.
        message:
          type: string
          description: The most recent commit message for the model.
          example: Altered priority value.
        mitre:
          type: object
          description: Models curated and maintained by the Darktrace analyst team are mapped to the MITRE ATT&CK framework,
            where applicable. This object will appear on mapped models only and contains information about the tactics and
            techniques mapped.
          properties:
            tactics:
              type: array
              items: {}
              description: An array of MITRE ATT&CK framework tactics the model has been mapped to.
            techniques:
              type: array
              items: {}
              description: An array of MITRE ATT&CK framework techniques the model has been mapped to.
        version:
          type: number
          description: The model version, increments on edit.
          example: 40.0
        priority:
          type: integer
          format: int64
          description: 'The numeric behavior category associated with the model: 0-3 equates to informational, 4 equates to
            suspicious and 5 equates to critical.'
          example: 40
        category:
          type: string
          description: The behavior category associated with the model.
          example: Critical
        compliance:
          type: boolean
          description: Whether the model is in the compliance model category. If true, takes priority over the value of category
            .
          example: false
      title: /models — Response Schema
      description: 'Fuente: https://customerportal.darktrace.com/guides/api-models-schema'
    ModelbreachesNoParameters:
      type: object
      properties:
        creationTime:
