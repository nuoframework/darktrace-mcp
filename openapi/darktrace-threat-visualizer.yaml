          type: object
          description: An object describing the log lines that were processed and matched successfully against templates on
            this master instance, broken down on a per-template basis.
          properties:
            exampletemplate:
              type: number
              description: An example log template and the number of times log lines have been processed and matched successfully
                for that type on this instance.
              example: 213587.0
        licenseCounts:
          type: object
          description: An object containing the number of devices and user accounts seen across Darktrace Real-Time Detection
            coverage areas.
          properties:
            saas:
              type: object
              description: An object containing one or more Darktrace modules and the number of users seen from that module
                in the last 7 days.
              properties:
                total:
                  type: number
                  description: The total number of users detected across all modules in the last 7 days.
                  example: 0.0
            licenseIPCount:
              type: number
              description: The peak value of the number of distinct internal (not excluded) IP addresses seen within any 24
                hour period over the last seven days. Does not overlap with licenseCloudIPCount .
              example: 249.0
        antigenaNetworkBlockedConnections:
          type: object
          description: An object representing Darktrace ⁄ NETWORK Autonomous Response attempts to end connections and number
            of those attempts where connectivity demonstrably continued. These fields are experimental and under active development,
            and should not be relied upon, or expected to remain stable, at the current time.
          properties:
            attempted:
              type: number
              description: The culmulative number of attempts made to end connections (fired RSTs) taken by Darktrace ⁄ NETWORK
                Autonomous Response on the given instance since it was upgraded to a software version where this value was
                recorded. One Darktrace ⁄ NETWORK action will produce multiple attempts, as attempts are recorded on a per-RST
                basis .This metric is experimental and under active development.
              example: 277149.0
            failed:
              type: number
              description: Attempts where Darktrace ⁄ NETWORK Autonomous Response has attempted to end a connection - and
                the associated RST packet was seen by the instance - but connectivity demonstrably continued after the RST
                was sent and/or observed. This metric is experimental and under active development.
              example: 1333.0
