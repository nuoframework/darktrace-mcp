  /summarystatistics:
    get:
      tags:
      - summarystatistics
      summary: GET /summarystatistics
      operationId: get_summarystatistics
      description: '/summarystatistics returns simple statistics on device counts, processed bandwidth and the number of active
        Darktrace Autonomous Response actions. It can be used for simple NOC monitoring of the instance device counts and
        processed bandwidth.


        **Notas (doc oficial):** By default, the endpoint returns 28 days with one interval representing 24 hours. Count values
        ( devicecount , subnets , totalClient , totalServer ) are calculated as total unique values in the last 7 days. licenseIPCount
        is calculated as peak unique IP address values in any 24 hour period in the last 7 days. usercredentialcount is calculated
        as total unique values in the last 28 days. patterns is calculated as total unique values in the last 12 weeks. When
        the eventtype parameter is used, intervals will represent 1 hour. Both endtime and to are supported when eventtype
        parameter is used. If an end time is specified, 28 before the specified date will be returned. The hours parameter
        allows the number of hour intervals to be specified (backwards from the end time). For example, with to=2021-02-12T12:00:00
        and hours=3 , 3 intervals:  2021-02-12 09:00:00, 2021-02-12 10:00:00, and 2021-02-12 11:00:00. Device counts and values
        returned by this endpoint are affected by visibility restrictions. Parameters which modify the response are not compatible
        with one another, only of of eventtype , csensor or mitreTactics may be used. The csensor parameter alters the output
        to just return time-series bandwidth information for Darktrace ⁄ ENDPOINT cSensor agents. Please refer to the schema
        for examples and more detailed information. The new mitreTactics parameter also significantly alters the response
        from this endpoint - no device count information is returned if this parameter is used. Please refer to the schema
        for examples and more detailed information.


        **Permiso mínimo (GET):** Visualizer


        Documentación: https://customerportal.darktrace.com/guides/api-summarystatistics-request'
      parameters:
      - name: responsedata
        in: query
        required: false
        description: When given the name of a top-level field or object, restricts the returned JSON to only that field or
          object.
        schema:
          type: string
      - name: eventtype
        in: query
        required: false
        description: Changes the format of data to return numeric event counts for any of the four categories of events and/or
          three types (see above).
        schema:
          type: string
      - name: endtime
        in: query
        required: false
        description: End time of data to return in millisecond format, relative to midnight January 1st 1970 UTC. Requires
          eventtype .
        schema:
          type: integer
          format: int64
      - name: to
        in: query
        required: false
        description: End time of data to return in YYYY-MM-DD HH:MM:SS format. Requires eventtype .
        schema:
          type: string
      - name: hours
        in: query
        required: false
        description: The number of hour intervals from the end time (or current time) to return. Requires eventtype .
        schema:
          type: integer
          format: int64
      - name: csensor
        in: query
        required: false
        description: When true , only bandwidth statistics are returned for Darktrace ⁄ ENDPOINT cSensor agents. When false
          , statistics returned are for Darktrace ⁄ NETWORK bandwidth
        schema:
          type: boolean
      - name: mitreTactics
        in: query
        required: false
        description: When true , alters the returned data to display total processed raw events and analysis outputs, broken
          down by MITRE ATT&CK Framework tactic.
        schema:
          type: boolean
      responses:
        '200':
          description: 'OK. Variantes de respuesta documentadas según parámetros: `SummarystatisticsNoParameters` (Response
            Schema (no parameters)), `SummarystatisticsEventtypeLoginput` (Response Schema - eventtype=loginput), `SummarystatisticsCsensorTrue`
            (Response Schema - csensor=true), `SummarystatisticsMitretacticsTrue` (Response Schema - mitretactics=true)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummarystatisticsNoParameters'
        '400':
          description: Petición inválida (p. ej. INPUT ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Firma, token o fecha (DTAPI-Date) inválidos
        '403':
          description: El usuario del token no tiene el permiso requerido
