  /network:
    get:
      tags:
      - network
      summary: GET /network
      operationId: get_network
      description: 'The /network endpoint returns data about connectivity between two or more devices - it can take a device
        or subnet option - and can be used for investigative and monitoring purposes.


        **Notas (doc oficial):** Time parameters must always be specified in pairs. The devices object contains any internal
        source/destination devices, the connection direction will not be specified. The connections object will specify source/target
        device pairs and directions. The default query for devices uses intext=internal , filtering the returned connections
        by internal only. Specifying intext=external will add an externaldevices object containing any external source/destination
        devices the device has interacted with. The default query for subnets will return both internal and external. The
        default timeframe is one hour. Please note, this endpoint does not support SaaS metrics.


        **Permiso mínimo (GET):** Unrestricted Devices¹ and Visualizer


        Documentación: https://customerportal.darktrace.com/guides/api-network-request'
      parameters:
