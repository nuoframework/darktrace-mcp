        Autonomous Response actions requiring approval. Information from Darktrace Autonomous Response Integrations, such
        as firewalls, is not included in this data.


        **Notas (doc oficial):** Time parameters must always be specified in pairs. When fulldevicedetails=true , actions
        will be contained in an actions: object and devices in a devices: object active=true means the action has been activated,
        either by human confirmation or automatically in fully autonomous mode. If an action is cleared manually, active will
        show false . If a Darktrace Autonomous Response action expires, it will continue to show active=true . Actions manually
        cleared by a user will have the value cleared=true , expired actions will have cleared=false . When an action is cleared
        manually, it will also set the active value to false . The includehistory parameter adds an additional history object
        to each action which describes all the historic states the action has been in, when the state changed, and the user
        that triggered the change. The valid states are created , created (requires confirmation) , extended , cleared , reactivated
        (expired) and reactivated (cleared) . If includeconnections=true , a connections object will be added with details
        of all connections that were blocked by active Darktrace Autonomous Response actions. Manual Darktrace ⁄ NETWORK Autonomous
        Response actions can be identified by "manual": true in the response. These actions will contain an object describing
        the triggerer of the action. For manual actions, the response fields model and modeluuid will appear empty and the
        model score will be set to 0 or 0.0 . For POST requests, if the "Audit Antigena" setting is enabled on the Darktrace
        System Config page, requests will fail unless the reason parameter is also specified. This parameter is otherwise
        optional, but the value will populate in the action history window (refer to Understanding the Darktrace Response
        Actions page ) if supplied.


        **Permiso mínimo (GET):** Unrestricted Devices¹ and Visualizer


        Documentación: https://customerportal.darktrace.com/guides/api-antigena-request'
      parameters:
      - name: fulldevicedetails
        in: query
        required: false
        description: Returns the full device detail objects for all devices referenced by data in an API response. Use of
          this parameter will alter the JSON structure of the API response for certain calls.
        schema:
          type: boolean
      - name: includecleared
        in: query
        required: false
        description: Returns all Darktrace Autonomous Response actions including those already cleared. Defaults to false.
        schema:
          type: boolean
      - name: includehistory
        in: query
        required: false
        description: Include additional history information about the action state, such as when it was created or extended.
        schema:
          type: boolean
      - name: needconfirming
        in: query
        required: false
        description: Filters returned Darktrace Autonomous Response actions by those that need human confirmation or do not
          need human confirmation.
        schema:
          type: boolean
      - name: endtime
        in: query
        required: false
        description: End time of data to return in millisecond format, relative to midnight January 1st 1970 UTC.
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        description: Start time of data to return in YYYY-MM-DD HH:MM:SS format.
        schema:
          type: string
      - name: starttime
        in: query
        required: false
        description: Start time of data to return in millisecond format, relative to midnight January 1st 1970 UTC.
        schema:
          type: integer
