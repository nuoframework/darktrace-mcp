  /details:
    get:
      tags:
      - details
      summary: GET /details
      operationId: get_details
      description: 'The /details endpoint returns a time-sorted list of connections and events for a device or entity (such
        as a user from an external platform). The request requires either a device ( did ), a model alert ID ( pbid ), a message
        field value ( msg ), or the blockedconnections parameter.


        **Notas (doc oficial):** Time parameters must always be specified in pairs. If the from or starttime parameter is
        used in a request, the count parameter must not be used. The default eventtype is connection . User devices covered
        by Darktrace modules do not return connection information. All Darktrace ⁄ IDENTITY and Darktrace ⁄ CLOUD user activity
        is eventtype=notice To review all connections Darktrace ⁄ NETWORK Autonomous Response attempted to action - including
        those that failed - use blockedconnections=all . For those that failed only, blockedconnections=failed . Finally,
        for those where an attempt was performed use blockedconnections=true .


        **Permiso mínimo (GET):** Unrestricted Devices¹ and any of : Visualizer/Darktrace ⁄ IDENTITY Console


        Documentación: https://customerportal.darktrace.com/guides/api-details-request'
