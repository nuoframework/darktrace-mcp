components:
  securitySchemes:
    DTAPIToken:
      type: apiKey
      in: header
      name: DTAPI-Token
      description: Token público
    DTAPIDate:
      type: apiKey
      in: header
      name: DTAPI-Date
      description: Fecha usada en la firma (±30 min respecto al servidor)
    DTAPISignature:
      type: apiKey
      in: header
      name: DTAPI-Signature
      description: HMAC-SHA1(private, request\npublic\ndate) en hexadecimal
  schemas:
    AdvancedsearchApiSearch:
      type: object
      properties:
        took:
          type: number
          description: The time the request took in milliseconds.
          example: 22.0
        timed_out:
          type: boolean
          description: Whether the response timed out.
          example: false
        _shards:
          type: object
          description: A system field.
          properties:
            total:
              type: number
              description: A system field.
              example: 2.0
            successful:
              type: number
              description: A system field.
              example: 2.0
            skipped:
              type: number
              description: A system field.
              example: 0.0
            failed:
              type: number
              description: A system field.
              example: 0.0
        hits:
          type: object
          description: An object encapsulating the advanced search entries that matched the request.
          properties:
            total:
              type: number
              description: The total number of entries that matched the query.
              example: 13123.0
            max_score:
              description: A system field.
            hits:
              type: array
              items:
                type: object
                properties:
                  _index:
                    type: string
                    description: The index the entry was returned from.
                    example: logstash-dt-01-2020.03.23
                  _type:
                    type: string
                    description: A system field.
                    example: doc
                  _id:
                    type: string
                    description: The unique id for the entry in the database.
                    example: K18S2Iqiu7Wz1jaN
                  _score:
                    description: A system field.
                  _source:
                    type: object
                    description: An object describing the entry.
                    properties:
                      '@fields':
                        type: object
                        description: An object containing all the relevant fields for the protocol. A list of fields that
                          may be returned for each protocol can be found at [].
                      '@type':
                        type: string
                        description: The protocol or entry type.
                        example: conn
                      '@timestamp':
                        type: string
                        description: A timestamp for the insertion of the entry into advanced search logs.
                        example: '2020-03-23T11:59:09'
                      '@message':
                        type: string
                        description: A unique string constructed from field values for the entry.
                        example: 1584964749.0817  CT6zqD1olMlncAp00  104.20.203.23  54250  172.217.169.36443  tcp  -  2\  64  Midstream
                          traffic  OTH  true  0  0  1584964749.0817  0  104  A  true  0
                  sort:
                    type: array
                    items: {}
                    description: A simplified timestamp for the record for sorting purposes.
              description: An array of advanced search entries.
        darktraceChildError:
          type: string
          description: The name of a probe which did not respond to the request.
          example: Factory Probe 1
        kibana:
          type: object
          description: Details about the advanced search logs.
          properties:
            index:
              type: array
              items: {}
              description: A system field.
            per_page:
              type: number
              description: The number of results returned in the page. If the size value is changed, will continue to return
                a value of 50.
              example: 50.0
            time:
              type: object
              description: The time window specified in the request.
              properties:
                from:
                  type: string
                  description: The start of the time window specified in the request.
                  example: '2020-03-23T00:09:24.980Z'
                to:
                  type: string
                  description: The end of the time window specified in the request.
                  example: '2020-03-23T12:09:24.980Z'
            default_fields:
              type: array
              items: {}
              description: Default fields always returned at the highest level.
      title: /advancedsearch/api/search — Response Schema
      description: 'Fuente: https://customerportal.darktrace.com/guides/api-advancedsearch-search-schema'
    AdvancedsearchApiAnalyzeMean:
      type: object
      properties:
        took:
          type: number
          description: The time the request took in milliseconds.
          example: 406.0
        timed_out:
          type: boolean
          description: Whether the response timed out.
          example: false
        _shards:
          type: object
          description: A system field.
          properties:
            total:
              type: number
              description: A system field.
              example: 2.0
            successful:
              type: number
              description: A system field.
              example: 2.0
            skipped:
              type: number
              description: A system field.
              example: 0.0
            failed:
              type: number
              description: A system field.
              example: 0.0
        hits:
          type: object
          description: An object encapsulating the advanced search entries that matched the request.
          properties:
            total:
              type: number
              description: The total number of entries that matched the query.
              example: 20573.0
            max_score:
              type: number
              description: A system field.
              example: 0.0
            hits:
              type: array
              items: {}
              description: An array of advanced search entries.
        aggregations:
          type: object
          description: Aggregated values to use in graphical operations.
          properties:
            stats:
              type: object
              description: An object describing statistical analysis on the results within that interval.
              properties:
                count:
                  type: integer
                  format: int64
                  description: The number of results contained within the grouped interval.
                  example: 10355
                min:
                  type: number
                  description: For the field specified when making the request, the minimum value observed within the interval.
                  example: 0.0
                max:
                  type: number
                  description: For the field specified when making the request, the maximum value observed within the interval.
                  example: 14651.0
                avg:
                  type: number
                  description: For the field specified when making the request, the average value observed within the interval.
                  example: 310.263351
                sum:
                  type: number
                  description: For the field specified when making the request, the sum of all values observed within the
                    interval.
                  example: 3212777.0
        darktraceChildError:
          type: string
          description: The name of a probe which did not respond to the request.
          example: FactoryProbe_1
        kibana:
