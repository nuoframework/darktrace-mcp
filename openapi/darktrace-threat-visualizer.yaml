      operationId: get_subnets
      description: 'The /subnets endpoint allows subnets processed by Darktrace to be retrieved and edited programmatically.
        This can be useful when automating changes to large number of subnets or managing the quality of traffic across the
        network.


        **Notas (doc oficial):** When specifying how many minutes/hours/days in the seensince parameter, 3min = 3mins, 5hour
        = 5hours, 6day = 6days, etc. This API call does not support searching for subnets by anything other than the sid.
        If the user needs to search for subnets by label, network, etc. they will need to download the full list first and
        then parse on the returned data When making a POST request to update the subnet location, both longitude and latitude
        must be specified. When supplying a label, do not use quotes around the string - this will result in a double-quoted
        string. If changing the latitude or longitude via the API, whole values must still be passed with a decimal point.
        For example, 10.0 .


        **Permiso mínimo (GET):** Any of : Visualizer/Darktrace ⁄ IDENTITY Console/Subnet Admin


        Documentación: https://customerportal.darktrace.com/guides/api-subnets-request'
