          description: The current installed version of the Model Engine - the system that evaluates model logic against metadata
            - which is distinct from the Threat Visualizer and Model Update bundles.
          example: 6.1.23 (f35936c6)
        ipAddress:
          type: string
          description: Where detectable, the IP address of the management interface.
          example: 10.0.18.224
        label:
          type: string
          description: A freetext label applied to the instance on the System Config page to better identify it.
          example: holdingsinc-master
        modelsUpdated:
          type: string
          description: The last time default models were updated.
          example: '2023-12-26 11:20:00'
        modelPackageVersion:
          type: string
          description: The model bundle information.
          example: 4.0-8515~20230322143408~g300d5d
        bundleVersion:
          type: string
