- name: deviceinfo
- name: devices
- name: devicesearch
- name: devicesummary
- name: endpointdetails
- name: enums
- name: filtertypes
- name: intelfeed
- name: mbcomments
- name: metricdata
- name: metrics
- name: models
- name: modelbreaches
- name: network
- name: pcaps
- name: similardevices
- name: status
- name: subnets
- name: summarystatistics
- name: tags
- name: agemail
paths:
  /advancedsearch/api/search/{query}:
    get:
      tags:
      - advancedsearch
      summary: GET /advancedsearch/api/search
      operationId: get_advancedsearch_api_search_query
      description: 'The /advancedsearch endpoint allows Advanced Search data to be queried and exported in JSON format from
        the Darktrace instance programmatically. Advanced Search queries are Base64 encoded strings, composed of the query
        search terms. There are three extensions available:


        **Notas (doc oficial):** Double quotes used in the search string must be escaped with a backslash before encoding.
        For example, "search":" @type:\"ssl\" AND @fields.dest_port:\"443\"" . The query timeframe can either take a starttime
        / endtime or to / from value, or a timeframe interval of seconds since the current time. If starttime / endtime or
        to / from is used, the timeframe value must be set to "custom" . Time parameters must always be specified in pairs.
        If using interval , the time: {} object can be omitted from the query. It is important to note that the query response
        will not be the same every time as the interval time value is relative. By default, this endpoint will return 50 records
        at a time. The size parameter can be used to return up to 10,000 results. Returned data can be paginated by limiting
        the size value and making multiple requests, incrementing the offset value by the size value each time (e.g., size=100
        , multiple queries for offset=0, offset=100, offset=200 ). The empty fields array is required but the values contained
        within it do not change the API response. All fields will be returned when accessing advanced search programmatically.
        The parameters graphmode and mode appear in Advanced Search queries made in the Threat Visualizer. They are not required
        when accessing Advanced Search programmatically. The analyze_field parameter is only required when making queries
        to the /advancedsearch/api/graph/mean endpoint. As of Darktrace 6.1, it is possible to use POST requests to make more
        complex queries. In this scenario, a POST request is made to /advancedsearch/api/search with the body `{"hash":"[base64
        encoded string]"}. Please see example three below for more information.


        Documentación: https://customerportal.darktrace.com/guides/api-advancedsearch-search-request'
      parameters:
      - name: query
        in: path
        required: true
        description: Consulta de Advanced Search en JSON codificado en Base64, p. ej. base64('{"search":"@type:dns","fields":[],"offset":0,"timeframe":"3600","time":{"user_interval":0}}').
        schema:
          type: string
          format: byte
      responses:
        '200':
          description: 'OK. Variantes de respuesta documentadas según parámetros: `AdvancedsearchApiSearch` (Response Schema)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvancedsearchApiSearch'
        '400':
          description: Petición inválida (p. ej. INPUT ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Firma, token o fecha (DTAPI-Date) inválidos
        '403':
          description: El usuario del token no tiene el permiso requerido
  /advancedsearch/api/search:
    post:
      tags:
      - advancedsearch
      summary: POST /advancedsearch/api/search
      operationId: post_advancedsearch_api_search
      description: 'The /advancedsearch endpoint allows Advanced Search data to be queried and exported in JSON format from
        the Darktrace instance programmatically. Advanced Search queries are Base64 encoded strings, composed of the query
        search terms. There are three extensions available:


        **Notas (doc oficial):** Double quotes used in the search string must be escaped with a backslash before encoding.
        For example, "search":" @type:\"ssl\" AND @fields.dest_port:\"443\"" . The query timeframe can either take a starttime
        / endtime or to / from value, or a timeframe interval of seconds since the current time. If starttime / endtime or
        to / from is used, the timeframe value must be set to "custom" . Time parameters must always be specified in pairs.
        If using interval , the time: {} object can be omitted from the query. It is important to note that the query response
        will not be the same every time as the interval time value is relative. By default, this endpoint will return 50 records
        at a time. The size parameter can be used to return up to 10,000 results. Returned data can be paginated by limiting
        the size value and making multiple requests, incrementing the offset value by the size value each time (e.g., size=100
        , multiple queries for offset=0, offset=100, offset=200 ). The empty fields array is required but the values contained
        within it do not change the API response. All fields will be returned when accessing advanced search programmatically.
        The parameters graphmode and mode appear in Advanced Search queries made in the Threat Visualizer. They are not required
        when accessing Advanced Search programmatically. The analyze_field parameter is only required when making queries
        to the /advancedsearch/api/graph/mean endpoint. As of Darktrace 6.1, it is possible to use POST requests to make more
        complex queries. In this scenario, a POST request is made to /advancedsearch/api/search with the body `{"hash":"[base64
        encoded string]"}. Please see example three below for more information.


        Documentación: https://customerportal.darktrace.com/guides/api-advancedsearch-search-request'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - hash
              properties:
                hash:
                  type: string
                  format: byte
                  description: Consulta Advanced Search (JSON) codificada en Base64. Método POST disponible desde 6.1 para
                    consultas largas.
      responses:
        '200':
          description: 'OK. Variantes de respuesta documentadas según parámetros: `AdvancedsearchApiSearch` (Response Schema)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvancedsearchApiSearch'
        '400':
          description: Petición inválida (p. ej. INPUT ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Firma, token o fecha (DTAPI-Date) inválidos
        '403':
          description: El usuario del token no tiene el permiso requerido
  /advancedsearch/api/analyze/{field}/{analysis}/{query}:
    get:
      tags:
      - advancedsearch
      summary: GET /advancedsearch/api/analyze
      operationId: get_advancedsearch_api_analyze_field_analysis_query
      description: 'The /advancedsearch endpoint allows Advanced Search data to be queried and exported in JSON format from
        the Darktrace instance programmatically. Advanced Search queries are Base64 encoded strings, composed of the query
        search terms.


        **Notas (doc oficial):** Double quotes used in the search string must be escaped with a backslash before encoding.
        For example, "search":" @type:\"ssl\" AND @fields.dest_port:\"443\"" . The query timeframe can either take a starttime
        / endtime or to / from value, or a timeframe interval of seconds since the current time. If starttime / endtime or
        to / from is used, the timeframe value must be set to "custom" . Time parameters must always be specified in pairs.
        If using interval , the time: {} object can be omitted from the query. It is important to note that the query response
        will not be the same every time as the interval time value is relative. The parameters graphmode and mode appear in
        Advanced Search queries made in the Threat Visualizer. They are not required when accessing Advanced Search programmatically.
        The empty fields array is required but the values contained within it do not change the API response.


        Documentación: https://customerportal.darktrace.com/guides/api-advancedsearch-analyze-request'
      parameters:
      - name: field
        in: path
        required: true
        description: Campo a analizar, p. ej. @fields.dest_port
        schema:
          type: string
      - name: analysis
        in: path
        required: true
        description: Tipo de análisis
        schema:
          type: string
          enum:
          - mean
          - terms
          - trend
          - score
      - name: query
        in: path
        required: true
        description: Consulta de Advanced Search en JSON codificado en Base64, p. ej. base64('{"search":"@type:dns","fields":[],"offset":0,"timeframe":"3600","time":{"user_interval":0}}').
        schema:
          type: string
          format: byte
      responses:
        '200':
          description: 'OK. Variantes de respuesta documentadas según parámetros: `AdvancedsearchApiAnalyzeMean` (Response
            Schema - /mean), `AdvancedsearchApiAnalyzeTerms` (Response Schema - /terms), `AdvancedsearchApiAnalyzeTrend` (Response
            Schema - /trend), `AdvancedsearchApiAnalyzeScore` (Response Schema - /score)'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AdvancedsearchApiAnalyzeMean'
                - $ref: '#/components/schemas/AdvancedsearchApiAnalyzeTerms'
                - $ref: '#/components/schemas/AdvancedsearchApiAnalyzeTrend'
                - $ref: '#/components/schemas/AdvancedsearchApiAnalyzeScore'
        '400':
          description: Petición inválida (p. ej. INPUT ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Firma, token o fecha (DTAPI-Date) inválidos
        '403':
          description: El usuario del token no tiene el permiso requerido
  /advancedsearch/api/graph/{graphmode}/{interval}/{query}:
    get:
      tags:
      - advancedsearch
      summary: GET /advancedsearch/api/graph
      operationId: get_advancedsearch_api_graph_graphmode_interval_query
      description: 'The /advancedsearch endpoint allows Advanced Search data to be queried and exported in JSON format from
        the Darktrace instance programmatically. Advanced Search queries are Base64 encoded strings, composed of the query
        search terms.


        **Notas (doc oficial):** Double quotes used in the search string must be escaped with a backslash before encoding.
        For example, "search":" @type:\"ssl\" AND @fields.dest_port:\"443\"" . The query timeframe can either take a starttime
        / endtime or to / from value, or a timeframe interval of seconds since the current time. If starttime / endtime or
        to / from is used, the timeframe value must be set to "custom" . Time parameters must always be specified in pairs.
        If using interval , the time: {} object can be omitted from the query. It is important to note that the query response
        will not be the same every time as the interval time value is relative. Data is returned in 24hr blocks, split at
        00:00 - queries which stretch across midnight must be paginated to return additional days. Pagination takes the form
        of an incremented, numeric extension (e.g. /1 ). Each increment goes further back in time by 24hrs. The "next": 1
        value in the response indicates if there are further pages. The analyze_field parameter is required when making queries
        to the mean extension. It must be provided in the Base64 encoded string. The graphmode parameter appears in Advanced
        Search queries made in the Threat Visualizer. When accessing Advanced Search programmatically, the type of data returned
        is controlled by the extension used - /advancedsearch/graph/count or /advancedsearch/graph/mean - rather than the
        graphmode field. The parameter "mode": appears in Advanced Search queries made in the Threat Visualizer. It is not
        required when accessing Advanced Search programmatically. The empty fields array is required but the values contained
        within it do not change the API response.


        Documentación: https://customerportal.darktrace.com/guides/api-advancedsearch-graph-request'
      parameters:
      - name: graphmode
        in: path
        required: true
        description: Tipo de gráfico
        schema:
          type: string
          enum:
          - count
          - mean
      - name: interval
        in: path
        required: true
        description: Intervalo de agrupación en milisegundos
        schema:
          type: integer
          format: int64
      - name: query
        in: path
        required: true
        description: Consulta de Advanced Search en JSON codificado en Base64, p. ej. base64('{"search":"@type:dns","fields":[],"offset":0,"timeframe":"3600","time":{"user_interval":0}}').
        schema:
          type: string
          format: byte
      responses:
        '200':
          description: 'OK. Variantes de respuesta documentadas según parámetros: `AdvancedsearchApiGraphGraphMean` (Response
            Schema - /graph/mean), `AdvancedsearchApiGraphGraphCount` (Response Schema - /graph/count)'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AdvancedsearchApiGraphGraphMean'
                - $ref: '#/components/schemas/AdvancedsearchApiGraphGraphCount'
        '400':
          description: Petición inválida (p. ej. INPUT ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Firma, token o fecha (DTAPI-Date) inválidos
        '403':
          description: El usuario del token no tiene el permiso requerido
  /aianalyst/groups:
    get:
      tags:
      - aianalyst
      summary: GET /aianalyst/groups
      operationId: get_aianalyst_groups
      description: 'The Darktrace Cyber AI Analyst investigates, analyzes and reports upon threats seen within your Darktrace
        environment; as a starting point, it reviews and investigates all model alerts that occur on the system. If anomalies
        or patterns of activity are identified during this analysis process, an event is created.


        **Notas (doc oficial):** A time window for the returned events can be specified using starttime / endtime and unix
        time in milliseconds. Where only endtime is set, starttime will default to 1 week before endtime . Where only starttime
        is set, endtime will default to the current time. If no time parameters are specified, events from the last seven
        days (and pinned events, if applicable) will be returned. For sid and did filters: If sid and did are used, a minimum
        of one event in an incident group must include the specified device or device in the specified subnet for the incident
        to be included. If excludesid and excludedid are used, no event in an incident group can include the specified device
        or devices in the specified subnet for the incident to be included. Incidents that are pinned or contain pinned events
        will always be returned, regardless of the time period specified. This can be prevented with includeallpinned=false
        . The includeonlypinned parameter can be used to only return incidents that have been pinned. Links back to the Threat
        Visualizer can be included in the response with includegroupurl=true . Where locale is not specified or not supported
        in the current software version, strings will default to en_GB . Where the specified locale uses non-ascii characters,
        these will be returned in unicode format and must be parsed. For scoring parameters minscore and maxscore , note that
        incident scores may change (increase) over time as new events are added with more severe behavior. The parameter groupid
        takes priority over all filters. The parameter uuid takes priority over all filters other than groupid . A groupid
        value can be found in the field id , or in the currentGroup field of an incident event retrieved from the /aianalyst/incidentevents
        endpoint. A uuid value can be found in the field uuid in the incidentEvents array, or in the id field of an incident
        event retrieved from the /aianalyst/incidentevents endpoint. As of Darktrace 6.1, incident events in the incidentEvents
        array may contain a sender value instead of a triggerDid , where the event activity is sourced from Darktrace ⁄ EMAIL.


        **Permiso mínimo (GET):** Unrestricted Devices¹ and any of : Visualizer/Darktrace ⁄ IDENTITY Console


        Documentación: https://customerportal.darktrace.com/guides/api-aianalyst-groups-request'
      parameters:
      - name: includeacknowledged
        in: query
        required: false
        description: Include acknowledged incidents in the data. False by default.
        schema:
          type: boolean
      - name: includeallpinned
        in: query
        required: false
        description: True by default. Controls whether pinned incidents are returned alongside those from the timeframe specified.
        schema:
          type: boolean
      - name: includeonlypinned
        in: query
        required: false
        description: False by default. Used to only return pinned incidents.
        schema:
          type: boolean
      - name: endtime
        in: query
        required: false
        description: End time of data to return in millisecond format, relative to midnight January 1st 1970 UTC.
        schema:
          type: integer
          format: int64
      - name: starttime
        in: query
        required: false
        description: Start time of data to return in millisecond format, relative to midnight January 1st 1970 UTC.
        schema:
          type: integer
          format: int64
      - name: locale
        in: query
        required: false
        description: The language for returned strings. Currently supported are de_DE (German), en_GB (English UK), en_US
          (English US), es_ES (Spanish ES), es_419 (Spanish LATAM), fr_FR (French), it_IT (Italian), ja_JP (Japanese), ko_KR
          (Korean) , pt_BR (Portuguese BR), zh_Hans (Chinese (Simplified)), zh_Hant (Chinese (Traditional))
        schema:
          type: string
      - name: includegroupurl
        in: query
        required: false
        description: Controls whether links to the incident in the Threat Visualizer are included in the response - requires
          the FQDN value to be set and valid for the queried instance. Defaults to false.
        schema:
          type: boolean
      - name: compliance
        in: query
        required: false
        description: Return incidents which have the "compliance" behavior category. Multiple category parameters can be specified.
        schema:
          type: boolean
      - name: suspicious
        in: query
        required: false
        description: Return only incidents which have the "suspicious" behavior category. Multiple category parameters can
          be specified.
        schema:
          type: boolean
      - name: critical
        in: query
        required: false
        description: Return only incidents which have the "critical" behavior category. Multiple category parameters can be
          specified.
        schema:
          type: boolean
      - name: did
        in: query
        required: false
        description: Identification number of a device modeled in the Darktrace system to include incidents for.
        schema:
          type: integer
          format: int64
      - name: excludedid
        in: query
        required: false
        description: Identification number of a device modeled in the Darktrace system to remove incidents for.
        schema:
          type: integer
          format: int64
      - name: sid
        in: query
        required: false
        description: Identification number of a subnet modeled in the Darktrace system to include incidents for.
        schema:
          type: integer
          format: int64
      - name: master
        in: query
        required: false
        description: Identification number of a master instance under a Unified View to include incidents for. Only relevant
          in Unified View environments.
        schema:
          type: integer
          format: int64
      - name: excludesid
        in: query
        required: false
        description: Identification number of a subnet modeled in the Darktrace system to remove incidents for.
        schema:
          type: integer
          format: int64
      - name: saasonly
        in: query
        required: false
        description: Restricts returned incidents to only those that contain a minimum of one incident event involving a user
          observed by a Darktrace ⁄ IDENTITY and/or Darktrace ⁄ CLOUD module.
        schema:
          type: boolean
      - name: maxscore
        in: query
        required: false
        description: The maximum score an incident can possess and still be returned. Replicates the slider filter on the
          Threat Tray. Accepts values between 0 and 100.
        schema:
          type: number
      - name: minscore
        in: query
        required: false
        description: The minimum score an incident can possess and still be returned. Replicates the slider filter on the
          Threat Tray. Accepts values between 0 and 100.
        schema:
          type: number
      - name: groupid
        in: query
        required: false
        description: A unique identifier of a Cyber AI Analyst incident. If specified, overrides all other filter parameters
          specified and only returns the specified incidents.
        schema:
          type: string
      - name: uuid
        in: query
        required: false
        description: A unique identifier of a Cyber AI Analyst incident event. If specified, overrides all other filter parameters
          (exception groupID , which takes priority) specified and only returns incidents containing the specified ids.
        schema:
          type: string
      responses:
        '200':
          description: 'OK. Variantes de respuesta documentadas según parámetros: `AianalystGroups` (Response Schema)'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AianalystGroups'
        '400':
          description: Petición inválida (p. ej. INPUT ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Firma, token o fecha (DTAPI-Date) inválidos
        '403':
          description: El usuario del token no tiene el permiso requerido
  /aianalyst/incidentevents:
    get:
      tags:
      - aianalyst
      summary: GET /aianalyst/incidentevents
      operationId: get_aianalyst_incidentevents
      description: 'The /aianalyst/incidentevents endpoint provides access to Cyber AI Analyst events - a group of anomalies
        or network activity investigated by Cyber AI Analyst.


        **Notas (doc oficial):** A time window for the returned events can be specified using starttime / endtime and unix
        time in milliseconds. Where only endtime is set, starttime will default to 1 week before endtime . Where only starttime
        is set, endtime will default to the current time. If no time parameters are specified, events from the last seven
        days (and pinned events, if applicable) will be returned. Events that are pinned or part of pinned incidents will
        always be returned, regardless of the time period specified. This can be prevented with includeallpinned=false The
        includeonlypinned parameter can be used to only return events that have been pinned. Where locale is not specified
        or not supported in the current software version, strings will default to en_GB . Where the specified locale uses
        non-ascii characters, these will be returned in unicode format and must be parsed. The uuid of an event can be found
        in the id field of the JSON response. For scoring parameters minscore and maxscore , note that incident scores may
        change (increase) over time as new events are added with more severe behavior. The parameter uuid takes priority over
        all filters. The parameter groupid takes priority over all filters other than uuid . A uuid value can be found in
        the field id , or in the field uuid in the incidentEvents array of an incident event retrieved from the /aianalyst/groups
        endpoint. A groupid value can be found in the field currentGroup , or in the id field of an incident event retrieved
        from the /aianalyst/groups endpoint. As of Darktrace 6.1, incident events may contain a sender value, indicating the
        event activity is sourced from Darktrace ⁄ EMAIL. For these events, the breachDevices array will be returned empty.
        Please see the response schema for a full breakdown of the details array.


        **Permiso mínimo (GET):** Unrestricted Devices¹ and any of : Visualizer/Darktrace ⁄ IDENTITY Console


        Documentación: https://customerportal.darktrace.com/guides/api-aianalyst-incidentevents-request'
      parameters:
      - name: includeacknowledged
        in: query
        required: false
        description: Include acknowledged events in the data.
        schema:
          type: boolean
      - name: includeallpinned
        in: query
        required: false
        description: True by default. Controls whether pinned events are returned alongside those from the timeframe specified.
        schema:
          type: boolean
      - name: includeonlypinned
        in: query
        required: false
        description: False by default. Used to only return pinned incident events.
        schema:
          type: boolean
      - name: includeincidenteventurl
        in: query
        required: false
        description: Controls whether links to events are included in the response - requires the FQDN value to be set and
          valid for the queried instance.
        schema:
          type: boolean
      - name: locale
        in: query
        required: false
        description: The language for returned strings. Currently supported are de_DE (German), en_GB (English UK), en_US
          (English US), es_ES (Spanish ES), es_419 (Spanish LATAM), fr_FR (French), it_IT (Italian), ja_JP (Japanese), ko_KR
          (Korean) , pt_BR (Portuguese BR), zh_Hans (Chinese (Simplified)), zh_Hant (Chinese (Traditional))
        schema:
          type: string
      - name: endtime
        in: query
        required: false
        description: End time of data to return in millisecond format, relative to midnight January 1st 1970 UTC.
        schema:
          type: integer
          format: int64
      - name: starttime
        in: query
        required: false
        description: Start time of data to return in millisecond format, relative to midnight January 1st 1970 UTC.
        schema:
          type: integer
          format: int64
      - name: groupcompliance
        in: query
        required: false
        description: Return only events that are part of incidents which have the "compliance" behavior category. Multiple
          category parameters can be specified.
        schema:
          type: boolean
      - name: groupsuspicious
        in: query
        required: false
        description: Return only events that are part of incidents which have the "suspicious" behavior category. Multiple
          category parameters can be specified.
        schema:
          type: boolean
      - name: groupcritical
        in: query
        required: false
        description: Return only events that are part of incidents which have the "critical" behavior category. Multiple category
          parameters can be specified.
        schema:
          type: boolean
      - name: maxscore
        in: query
        required: false
        description: The maximum score an event can possess and still be returned. Accepts values between 0 and 100.
        schema:
          type: number
      - name: minscore
        in: query
        required: false
        description: The minimum score an event can possess and still be returned. Accepts values between 0 and 100.
        schema:
          type: number
      - name: maxgroupscore
        in: query
        required: false
        description: Restrict returned events by the maximum incident score for the incident it is associated with. Accepts
          values between 0 and 100.
        schema:
          type: integer
          format: int64
      - name: mingroupscore
        in: query
        required: false
        description: Restrict returned events by the minimum incident score for the incident it is associated with. Accepts
          values between 0 and 100.
        schema:
          type: integer
          format: int64
      - name: did
        in: query
        required: false
