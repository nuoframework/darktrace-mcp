          type: array
          items: {}
          description: The device ids of devices on the blacklist for this model.
        didExclusions:
          type: array
          items: {}
          description: The device ids of devices on the whitelist for this model.
        throttle:
          type: integer
          format: int64
          description: For an individual device, this is the value in seconds for which this model will not fire again.
          example: 3600
        sharedEndpoints:
          type: boolean
          description: For models that contain multiple components that reference an endpoint, this value indicates whether
            all endpoints should be identical for the model to fire.
          example: true
        interval:
          type: integer
          format: int64
          description: Where a model contains multiple components, this interval represents the time window in seconds in
            which all the components should fire for this model to be triggered.
          example: 0
        sequenced:
          type: boolean
          description: A system field.
          example: false
        active:
          type: boolean
          description: Whether the model is active or not.
          example: true
        retired:
          type: boolean
          description: The model has since been deleted.
          example: false
        instanceID:
          type: number
          description: A system field.
          example: 19000.0
        acknowledged:
          description: Whether the model alert has been acknowledged. If false, a boolean. If true, an object containing the
            user who acknowledged the event and the time of acknowledgement.
        state:
          type: string
          description: A system field.
          example: New
        score:
          type: number
          description: The model alert score, represented by a value between 0 and 1.
          example: 0.372238
        commentCount:
          type: number
          description: The number of comments made against this model alert.
          example: 0.0
        componentBreaches:
          type: array
          items: {}
          description: Of the components associated with this model, the component ID(s) of those that were triggered to create
            the alert.
        componentBreachTimes:
          type: array
          items: {}
          description: The time at which the components were triggered sucessfully.
        devices:
          type: array
          items: {}
          description: The device ids of the devices involved in this model alert.
        deviceLabels:
          type: array
          items: {}
