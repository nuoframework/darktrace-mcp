    AianalystStats:
      type: object
      properties:
        equivalentHumanTime:
          type: integer
          format: int64
          description: Based upon the investigations Cyber AI Analyst performed over the time period, the total estimated
            equivalent time it would take for a human analyst to perform the same analysis.
          example: 9684480000
        positiveInvestigations:
          type: number
          description: The number of Cyber AI Analyst investigations over the time period which resulted in the creation of
            Cyber AI Analyst incident events.
          example: 191.0
        negativeInvestigations:
          type: number
          description: The number of Cyber AI Analyst investigations over the time period which did not discover activity
            considered suspicious enough to result in the creation of a Cyber AI Analyst incident event.
          example: 2583.0
        graphData:
          type: object
          description: An object containing metadata about each individual Cyber AI Analyst investigations across the time
            frame.
          properties:
            breachTime:
              type: array
              items: {}
              description: The time of each model alert that triggered the investigation in epoch time.
            endTime:
              type: array
              items: {}
              description: For each investigation, the time at which Cyber AI Analyst completed its investigation in epoch
                time.
            equivalentHumanTime:
              type: array
              items: {}
              description: The estimated equivalent time it would take for a human analyst to perform the same analysis as
                Cyber AI Analyst for each investigation.
            isPositive:
              type: array
              items: {}
              description: Whether each investigation resulted in the creation of a Cyber AI Analyst incident event.
            aiaScore:
              type: array
              items: {}
              description: The score of the associated Cyber AI Analyst incident event for each event created. If no event
                was created, may be null .
        attackPhases:
          type: array
          items:
            type: object
            properties:
              phases:
                type: array
                items: {}
                description: An example phase.
              count:
                type: integer
                format: int64
                description: The number of Cyber AI Analyst incident events relevant to this phase.
                example: 124
          description: An array of information about the Cyber AI Analyst attack phases for incident events created over the
            timeframe.
        groupStats:
          type: object
          description: Aggregated statistics about the grouped Cyber AI Analyst incidents produced over the time period -
            grouped in this case refers to groups of incident events which have been associated into incidents.
          properties:
            total:
              type: number
              description: The total number of groups - Cyber AI Analyst incidents - created during the time frame
              example: 120.0
            compliance:
              type: number
              description: The number of Cyber AI Analyst incidents categorized as having the "compliance" threat behavior
                category over the time period.
              example: 2.0
            suspicious:
              type: number
              description: The number of Cyber AI Analyst incidents categorized as having the "suspicious" threat behavior
                category over the time period.
              example: 70.0
            critical:
              type: number
              description: The number of Cyber AI Analyst incidents categorized as having the "critical" threat behavior category
                over the time period.
              example: 48.0
            mitreTactics:
              type: object
              description: For the grouped Cyber AI Analyst incidents created over the time frame, this object describes how
                these incidents are mapped to MITRE ATT&CK Framework tactics.
              properties:
                total:
                  type: object
                  description: An object describing the total number of incidents relevant to each MITRE ATT&CK Framework
                    tactic, across all threat behavior categories. If there are no incidents relevant to a tactic, the key
                    for that tactic will not appear. The example provided is non-exhaustive.
                  properties:
                    discovery:
                      type: number
                      description: The total number of incidents relevant to the MITRE ATT&CK Framework tactic "discovery".
                      example: 5.0
                compliance:
                  type: object
                  description: An object describing the number of incidents categorized as "compliance" (threat behavior category)
                    that are relevant to each MITRE ATT&CK Framework tactic. If there are no incidents relevant to a tactic,
                    the key for that tactic will not appear. The example provided is non-exhaustive.
                  properties:
                    discovery:
                      type: number
                      description: The total number of "compliance" incidents relevant to the MITRE ATT&CK Framework tactic
                        "discovery".
                      example: 2.0
                suspicious:
                  type: object
                  description: An object describing the number of incidents categorized as "suspicious" (threat behavior category)
                    that are relevant to each MITRE ATT&CK Framework tactic. If there are no incidents relevant to a tactic,
                    the key for that tactic will not appear. The example provided is non-exhaustive.
                  properties:
                    discovery:
                      type: number
                      description: The total number of "suspicious" incidents relevant to the MITRE ATT&CK Framework tactic
                        "discovery".
                      example: 5.0
                critical:
                  type: object
                  description: An object describing the number of incidents categorized as "critical" (threat behavior category)
                    that are relevant to each MITRE ATT&CK Framework tactic. If there are no incidents relevant to a tactic,
                    the key for that tactic will not appear. The example provided is non-exhaustive.
                  properties:
                    exfiltration:
                      type: number
                      description: The total number of "critical" incidents relevant to the MITRE ATT&CK Framework tactic
                        "discovery".
                      example: 45.0
        metadata:
          type: object
          description: An object containing system information.
          properties:
            estimatedQueries:
              type: number
              description: A system field.
              example: 0.0
            estimatedQueryMs:
              type: number
              description: A system field.
              example: 0.0
            ratioEstimated:
              type: number
              description: A system field.
              example: 0.0
      title: /aianalyst/stats — Response Schema
      description: 'Fuente: https://customerportal.darktrace.com/guides/api-aianalyst-stats-schema'
    AianalystInvestigations:
      type: object
      properties:
        investigationId:
          type: string
          description: A unique identifier for the investigation itself.
          example: 52c75821-7c17-4a69-b07f-1c74789a9452
        time:
          type: integer
          format: int64
          description: The time at which the investigation was created in epoch time.
          example: 1702310487
        investigationTime:
          type: integer
          format: int64
          description: The timestamp around which the investigation was focused in epoch time.
          example: 1701864000
        did:
          type: integer
          format: int64
          description: The device identifier of the device that was investigated.
          example: 12345
        version:
          type: number
          description: A system field
          example: 2.0
        status:
          type: string
          description: The current status of the investigation. Can be "pending", "processing", or "finished".
          example: finished
        createdBy:
          type: string
          description: The user who triggered the investigation.
          example: i_west
        noticeUid:
          type: string
          description: A system field.
          example: NvUIJpg9MfXywYtc
        pbid:
          type: integer
          format: int64
          description: A system field. The model alert id of the "AI Analyst Investigation" model alert that initiated the
            investigation.
          example: 9182907
        incidentId:
          type: string
          description: The unique identifier of the Cyber AI Analyst incident event created to describe the activity found.
            Can be used with other Cyber AI Analyst API endpoints to review in more detail. Only present if the investigation
            resulted in findings.
          example: af763617-2626-4e4c-84fc-e03d5cd8e6c8
        summarizer:
          type: string
          description: In this case, the system name for the summarizer which identified the activity Cyber AI Analyst chose
            to surface to the end user. See above for more details.
          example: SaasHijackSummary
        incidents:
          type: array
          items:
            type: object
            properties:
              uuid:
                type: string
                description: Same as incidentID field above.
                example: af763617-2626-4e4c-84fc-e03d5cd8e6c8
              related:
                type: array
                items: {}
                description: '829'
              summariser:
                type: string
                description: Same as summarizer above.
                example: SaasHijackSummary
          description: An array of Cyber AI Analyst incident events created as a result of the investigation. Empty if no
            activity is surfaced as a result.
      title: /aianalyst/investigations — Response Schema
      description: 'Fuente: https://customerportal.darktrace.com/guides/api-aianalyst-investigations-schema'
    AianalystIncidentsSingleEvent:
      type: object
      properties:
        aiaScore:
          type: number
          description: The reportability of the event as classified by Cyber AI Analyst - out of 100.
          example: 100.0
        children:
          type: array
          items: {}
          description: A unique identifier that can be used to request this Cyber AI Analyst event. This array will only contain
            one entry as of v5.2 and above.
        createdAt:
          type: number
          description: Timestamp for event creation in epoch time.
          example: 1646389417644.0
        category:
          type: string
          description: The behavior category associated with the incident event. Relevant for v5.2+ incident construction
            only.
          example: suspicious
        currentGroup:
          type: string
          description: The UUID of the current incident this event belongs to. Used for v5.2+ incident construction.
          example: gc0ec5c71-b4fb-429b-82a7-4d6a73cbcaed
        summary:
          type: string
          description: A textual summary of the suspicious activity.
          example: A chain of administrative connections were observed between multiple devices, which occurred around the
            same time, and included workstation-local-82.
        id:
          type: string
          description: A unique identifier that can be used to request this Cyber AI Analyst event.
          example: c0ec5c71-b4fb-429b-82a7-4d6a73cbcaed
        pinned:
          type: boolean
          description: Whether the event, or an incident that the event is associated with, is pinned within the Threat Visualizer
            user interface. Pinned events will always return regardless of the timeframe specified.
          example: true
        acknowledged:
          type: boolean
          description: Whether the event has been acknowledged.
          example: false
        details:
          type: array
          items:
            type: object
            properties:
              header:
                type: string
                description: A short title describing the section of information.
                example: First Hop
              contents:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      description: The type of information contained within the object. A full list of examples is available.
                      example: device
                    key:
                      type: string
                      description: Assigns meaning to the values in the values field - a short description of the data.
                      example: Source device
                    values:
                      type: array
                      items: {}
                      description: One or more values that relate to the key. For example, a series of ports or hostnames.
                        Full examples of all data types are available.
                description: An array of multiple objects describing relevant information for this subsection, such as involved
                  devices, relevant external hosts, ports used and anomaly scorings.
          description: An array of multiple sections (sub-arrays) of event information. Please see Understanding the details
            array" above. "
        summariser:
          type: string
          description: In this case, the system name for the summarizer which identified the activity Cyber AI Analyst chose
            to surface to the end user. See above for more details.
          example: LateralMovementCrawler
        relatedBreaches:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: number
                description: The timestamp at which the model alert occurred in epoch time.
                example: 1579710173000.0
              threatScore:
                type: number
                description: The alert score of the associated model alert - out of 100.
                example: 19.0
              pbid:
                type: integer
                format: int64
                description: The "policy breach ID" unique identifier of the model alert.
                example: 252317
              modelName:
                type: string
                description: The name of the model that triggered a model alert.
                example: Anomalous Connection / Active SSH Tunnel
          description: An array of model alerts related to the activity investigated by Cyber AI Analyst.
        sender:
          type: string
          description: If the incident event is created from Darktrace ⁄ EMAIL activity, this field will be populated with
            an email address representing the sender of the anomalous email or email campaign investigated. Otherwise, null.
          example: example@example.com
        breachDevices:
          type: array
          items:
            type: object
            properties:
              sid:
                type: integer
                format: int64
                description: The subnet id for the subnet the device is currently located in.
                example: 10
              mac:
                type: string
                description: The MAC address associated with the device.
                example: 93:gb:28:g1:fc:g1
              ip:
                type: string
                description: The IP associated with the device.
                example: 10.15.3.39
              identifier:
                type: string
                description: An identifier for the device used when constructing summaries or reports. May be the device label,
                  hostname or IP, depending on availability.
                example: workstation-local-82
              did:
                type: integer
                format: int64
                description: The unique "device id" identifier for the device that triggered the alert. This field is used
                  to group events into device-based incidents within the Threat Visualizer.
                example: 561
              hostname:
                type: string
                description: The hostname associated with the device, if available.
                example: workstation-local-82
              subnet:
                type: string
                description: The subnet label for the corresponding subnet, if available.
                example: Finance Subnet
          description: An array of devices involved in the related model alert(s). For incident events created from Darktrace
            ⁄ EMAIL activity, this array is empty.
        periods:
          type: array
          items:
            type: object
            properties:
              start:
                type: integer
                format: int64
                description: A timestamp for the start of the activity period in epoch time.
                example: 1579708374972
              end:
                type: integer
                format: int64
                description: A timestamp for the end of the activity period in epoch time.
                example: 1579711920166
          description: An array of one or more periods of time where anomalous activity occurred that Cyber AI Analyst investigated.
        attackPhases:
          type: array
          items: {}
          description: Of the six attack phases, which phases are applicable to the activity.
        mitreTactics:
          type: array
          items: {}
          description: An array of MITRE ATT&CK Framework tactics that have been mapped to this event.
        groupingIds:
          type: array
          items: {}
          description: Each entry in the groupingIDs array refers to a device that triggered the activity detection. In single
            events, should only contain one ID. If groupByActivity=false , this field should be used to group events together
            into an incident. Used by pre-v5.2 legacy incident construction.
        activityId:
          type: string
          description: An identifier for the specific activity detected by Cyber AI Analyst. If groupByActivity=true , this
            field should be used to group events together into an incident. Used by pre-v5.2 legacy incident construction.
          example: ae463dc8
        groupByActivity:
          type: boolean
          description: Indicates whether the event should be aggregated by activity or by device to create an incident. When
            true, the event should be aggregated by activityID, and when false, aggregated by groupingID(s). Used by pre-v5.2
            legacy incident construction.
          example: false
        title:
          type: string
          description: A title describing the activity that occurred.
          example: Suspicious Chain of Administrative Connections
        groupCategory:
          type: string
          description: The behavior category associated with the incident overall. Relevant for v5.2+ incident construction
            only.
          example: suspicious
        groupPreviousGroups:
          type: array
          items: {}
          description: If the incident event was part of an incident which was later merged with another, the UUIDs of the
            incidents before they were merged. Used for v5.2+ incident construction.
        groupScore:
          type: number
          description: The current overall score of the incident this event is part of. Relevant for v5.2+ incident construction
            only.
          example: 27.72702944
        userTriggered:
          type: boolean
          description: Whether the event was created as a result of a user-triggered Cyber AI Analyst investigation.
          example: false
        externalTriggered:
          type: boolean
          description: Whether the event was created as a result of an externally triggered Cyber AI Analyst investigation.
          example: false
      title: /aianalyst/incidents — Response Schema - Single Event
      description: 'Fuente: https://customerportal.darktrace.com/guides/api-aianalyst-incidents-schema'
