        required: false
        description: Return full details about expiry time and description for each entry.
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    type: string
                  description: Lista simple de entradas
                - type: array
                  items:
                    $ref: '#/components/schemas/IntelfeedFulldetailsTrue'
        '400':
          description: Petición inválida (p. ej. INPUT ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Firma, token o fecha (DTAPI-Date) inválidos
        '403':
          description: El usuario del token no tiene el permiso requerido
    post:
      tags:
      - intelfeed
      summary: POST /intelfeed
      operationId: post_intelfeed
      description: '/intelfeed is the programmatic way to access Watched Domains , a list of domains, IPs and hostnames utilized
        by the Darktrace system, Darktrace Inoculation and STIX/TAXII integration to create model alerts.


        **Notas (doc oficial):** The removeall and addlist parameters can be used together When supplying a description, do
        not use quotes around the string - this will result in a double-quoted string. Hostnames can be supplied using the
        hostname=true parameter. Hostnames will be treated as exact values and are indicated on the Watched Domains list with
        a * . The removeall parameter will remove all watched domain entries, regardless of source.


        **Permiso mínimo (POST / DELETE):** Edit Domains


        Documentación: https://customerportal.darktrace.com/guides/api-intelfeed-request'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                addentry:
                  type: string
                  description: Add an external domain, hostname or IP address. Available for POST requests.
                addlist:
                  type: string
                  description: Add a new line or comma separated list of external domains, hostnames and IP addresses. Available
                    for POST requests.
