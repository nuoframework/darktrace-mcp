        bar.


        **Notas (doc oficial):** Time parameters must always be specified in pairs. To specify multiple metrics to return
        time-series data for, replace the metric parameter with metric1= , metric2= , etc. Multiple metric objects will then
        be returned. The interval value allows data to be grouped into wider ''bars'' for time-series graphs. The default
        interval is 1 minute ( interval=60 ). breachtimes=true will return any model alerts that happened within the timeframe
        on the device or within the subnet specified. This parameter will alter the structure of the returned data.


        **Permiso mínimo (GET):** Visualizer


