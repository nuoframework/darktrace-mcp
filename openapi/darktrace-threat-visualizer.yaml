    StatusFastTrueIncludechildrenFalse:
      type: object
      properties:
        excessTraffic:
          type: boolean
          description: Whether the instance is receiving more traffic than it can reasonably process.
          example: false
        time:
          type: string
          description: The current server time in UTC.
          example: '2023-12-31 14:53:57'
        installed:
          type: string
          description: The date that the first data was received by the instance.
          example: 10/22/18
        mobileAppConfigured:
          type: boolean
          description: Whether the Darktrace Mobile App is configured.
          example: true
        version:
