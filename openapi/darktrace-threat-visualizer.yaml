        time:
          type: integer
          format: int64
          description: The first time the device was seen on the network. Will only appear in device objects retrieved from
            the \devices endpoint - equivalent field is firstSeen when device objects are retrieved from other endponts.
          example: 1528810000000
        endtime:
          type: integer
          format: int64
          description: The last time the device was seen on the network. Will only appear in device objects retrieved from
            the \devices endpoint - equivalent field is lastSeen when device objects are retrieved from other endponts.
