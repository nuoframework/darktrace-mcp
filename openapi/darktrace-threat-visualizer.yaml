                  description: The "policy id" of the model that created the alert.
                  example: 1
                phid:
                  type: integer
                  format: int64
                  description: The model "policy history" id. Increments when the model is modified.
                  example: 1
                uuid:
                  type: string
                  description: A unique ID that is generated on creation of the model.
                  example: 80010119-6d7f-0000-0305-5e0000000215
                mitre:
                  type: object
                  description: Models curated and maintained by the Darktrace analyst team are mapped to the MITRE ATT&CK
                    framework, where applicable. This object will appear on mapped models only and contains information about
                    the tactics and techniques mapped.
                  properties:
                    tactics:
                      type: array
                      items: {}
                      description: An array of MITRE ATT&CK framework tactics the model has been mapped to.
                    techniques:
                      type: array
                      items: {}
                      description: An array of MITRE ATT&CK framework techniques the model has been mapped to.
                logic:
                  type: object
                  description: A data structure that describes the conditions to bring about a model alert.
                  properties:
                    data:
