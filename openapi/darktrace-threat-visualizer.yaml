  /devices:
    get:
      tags:
      - devices
      summary: GET /devices
      operationId: get_devices
      description: 'The /devices endpoint returns a list of devices identified by Darktrace or details of a specific device
        given a time window. When a did is specified, the endpoint returns the information displayed in the UI pop-up when
        hovering over a device.


        **Notas (doc oficial):** Device objects may not have values for all of the attributes available. If a device does
        not have a MAC address, a label, credentials, or a hostname, they will not be included in the returned JSON. Devices
        with a priority of 0 will not have a priority attribute returned. This endpoint does not support searching outside
        the did , sid , ip and saasfilter parameters. To perform custom searches, the /devicesearch endpoint is recommended.
        The default timeframe is 7 days. When accessing the /devices endpoint from a browser, an additional parameter - minscore
        - is required. This parameter controls the devices that return by their device score (score of associated model alerts)
        and takes values from 0 to 1, where a score threshold of 70% would be minscore=0.7 . To return all devices regardless
        of score, minscore=0 should be added to the query. This parameter is not available when using the API programmatically
        with an authentication token - minscore is set to 0. As of Darktrace 6.1, device types altered by API requests can
        only be overridden by manual changes or further API requests. Passive analysis, model actions or hostname expressions
        are no longer able to override types set via the API. The saasfilter parameter takes a wildcard string which is matched
        to the SaaS::[platform] value (e.g. SaaS::Office365 ). Multiple filters can be applied to include multiple modules
        - for example, saasfilter=gcp*&saasfilter=office365* . A wildcard ( * ) must be specified at the end of this parameter
        value.


        **Permiso mínimo (GET):** Unrestricted Devices¹ and any of : Visualizer/Darktrace ⁄ IDENTITY Console/View Models/Edit
        Models/Device Admin


        Documentación: https://customerportal.darktrace.com/guides/api-devices-request'
      parameters:
      - name: did
        in: query
        required: false
        description: Identification number of a device modelled in the Darktrace system.
        schema:
          type: integer
          format: int64
      - name: ip
        in: query
        required: false
        description: IP of the device modelled in the Darktrace system.
        schema:
          type: string
      - name: iptime
        in: query
        required: false
        description: Returns the device which had the IP at a given time.
        schema:
          type: string
      - name: mac
        in: query
        required: false
        description: Returns the device with this MAC address.
        schema:
          type: string
      - name: seensince
        in: query
        required: false
        description: Relative offset for activity. Devices with activity in the specified time period are returned. The format
          is either a number representing a number of seconds before the current time, or a number with a modifier such as
          second, minute, hour day or week (Minimum=1 second).
        schema:
          type: string
      - name: sid
        in: query
        required: false
        description: Identification number of a subnet modelled in the Darktrace system.
        schema:
          type: integer
          format: int64
      - name: count
        in: query
        required: false
        description: The number of devices to return. Only limits the number of devices within the current timeframe.
        schema:
          type: integer
          format: int64
      - name: includetags
        in: query
        required: false
        description: Whether to include tags applied to the device in the response.
        schema:
