      title: /modelbreaches — Response Schema - historicmodelonly=true
      description: 'Fuente: https://customerportal.darktrace.com/guides/api-modelbreaches-schema'
    ModelbreachesHistoricmodelonlyTrueDeviceattopFalse:
      type: object
      properties:
        creationTime:
          type: integer
          format: int64
          description: The timestamp that the record of the model alert was created. This is distinct from the "time" field.
          example: 1530000000000
        breachUrl:
          type: string
          description: A link to the specific model alert in the Darktrace Threat Visualizer - the configuration option FQDN
            must be set for this field to appear.
          example: https://appliance-fqdn/#modelbreaches/123
        commentCount:
          type: number
          description: The number of comments made against this model alert.
          example: 2.0
        pbid:
          type: integer
          format: int64
          description: The "policy breach ID" of the model alert.
          example: 123
        time:
          type: integer
          format: int64
          description: The timestamp of the first activity which met the model criteria in epoch time.
          example: 1530000000000
        model:
          type: object
          description: An object describing the model logic at the time of request. Requires historicModelOnly=true .
          properties:
            name:
              type: string
              description: Name of the model that created the alert.
              example: Anomalous Connection::1 GiB Outbound
            pid:
              type: integer
              format: int64
              description: The "policy id" of the model that created the alert.
              example: 1
            phid:
              type: integer
              format: int64
              description: The model "policy history" id. Increments when the model is modified.
              example: 1
            uuid:
              type: string
              description: A unique ID that is generated on creation of the model.
              example: 80010119-6d7f-0000-0305-5e0000000215
            mitre:
              type: object
              description: Models curated and maintained by the Darktrace analyst team are mapped to the MITRE ATT&CK framework,
                where applicable. This object will appear on mapped models only and contains information about the tactics
                and techniques mapped.
              properties:
                tactics:
                  type: array
                  items: {}
                  description: An array of MITRE ATT&CK framework tactics the model has been mapped to.
                techniques:
                  type: array
                  items: {}
                  description: An array of MITRE ATT&CK framework techniques the model has been mapped to.
            logic:
              type: object
              description: A data structure that describes the conditions to bring about a model alert.
              properties:
                data:
                  type: array
                  items: {}
                  description: If the model is a checklist type this will be a list of component ID numbers. If this model
                    is a weighted type this will be a list of component ID, weight object pairs.
                type:
                  type: string
                  description: The type of model.
                  example: componentList
                version:
                  type: number
                  description: A number representing the version of model logic.
                  example: 1.0
            throttle:
              type: integer
              format: int64
              description: For an individual device, this is the value in seconds for which this model will not fire again.
              example: 3600
            sharedEndpoints:
              type: boolean
              description: For models that contain multiple components that reference an endpoint, this value indicates whether
                all endpoints should be identical for the model to fire.
              example: false
            actions:
              type: object
              description: The action to perform as a result of matching this model firing.
              properties:
                alert:
                  type: boolean
                  description: If true, an alert turned on will be pushed out to external systems if conditions for such alerting
                    are met.
                  example: true
                antigena:
                  type: object
                  description: An object containing the Darktrace Autonomous Response to be applied as a result of the model
                    triggering a model alert.
                breach:
                  type: boolean
                  description: If true, an alert turned on will be pushed out to external systems if conditions for such alerting
                    are met.
                  example: true
                model:
                  type: boolean
                  description: If true, creates an event in the device's event log without creating an alert/ model alert
                    in the threat tray.
                  example: true
                setPriority:
                  type: boolean
                  description: If the priority is to be changed as a result of a model alert, the numeric value it should
                    become. If no priority change action, a false boolean.
                  example: false
                setTag:
                  type: boolean
                  description: If a tag is to be applied as a result of a model alert, a single number or array of the system
                    ID for the tag(s) to be applied. If no tag action, a false boolean.
                  example: false
                setType:
                  type: boolean
                  description: If a change device type action is to be applied as a result of a model alert, the numeric system
                    ID for the label to be applied. If no change device type action is applied to the model, a false boolean.
                  example: false
            tags:
              type: array
              items: {}
              description: A list of tags that have been applied to this model in the Threat Visualizer model editor.
            interval:
              type: integer
              format: int64
              description: Where a model contains multiple components, this interval represents the time window in seconds
                in which all the components should fire for this model to be triggered.
              example: 0
            sequenced:
              type: boolean
              description: Whether the components are required to fire in the specified order for the model alert to occur.
              example: false
            active:
              type: boolean
              description: Whether the model is enabled or disabled.
              example: true
            modified:
              type: string
              description: Timestamp at which the model was last modified, in a readable format.
              example: '2018-06-12 14:00:00'
            activeTimes:
              type: object
              description: An object describing device whitelisting or blacklisting configured for this model.
              properties:
                devices:
                  type: object
                  description: The device ids for devices on the list.
                tags:
                  type: object
                  description: A system field.
                type:
                  type: string
                  description: 'The type of list: "restrictions" indicates a blacklist, "exclusions" a whitelist.'
                  example: exclusions
                version:
                  type: number
                  description: A system field.
                  example: 2.0
            priority:
              type: integer
              format: int64
              description: The model's priority affects the strength with which it alerts (0-5 scale).
              example: 1
            autoUpdatable:
              type: boolean
              description: Whether the model is suitable for auto update.
              example: true
            autoUpdate:
              type: boolean
              description: Whether the model is enabled for auto update.
              example: true
            autoSuppress:
              type: boolean
              description: Whether the model will automatically be suppressed in the case of over-triggering.
              example: true
            description:
              type: string
              description: The optional description of the model.
              example: A device is moving large volumes of data (1GiB+) out of the network...
            behaviour:
              type: string
              description: The score modulation function as set in the model editor.
              example: decreasing
            defeats:
              type: array
              items:
                type: object
                properties:
                  arguments:
                    type: object
                    description: An object describing the values associated with a model defeat.
                    properties:
                      value:
                        type: string
                        description: The value(s) that must match for the defeat to take effect.
                        example: www.example.com
                  comparator:
                    type: string
                    description: The comparator that the value is compared against the create the defeat.
                    example: does not match
                  defeatID:
                    type: number
                    description: A unique ID for the defeat.
                    example: 1.0
                  filtertype:
                    type: string
                    description: The filter the defeat is made from.
                    example: Connection hostname
              description: An array of model defeats - AND conditions - which if met, prevent the model from triggering a
                model alert.
            created:
              type: object
              description: An object describing the creation of the model.
              properties:
                by:
                  type: string
                  description: Username that created the model.
                  example: System
            edited:
              type: object
              description: An object describing the edit history of the model.
              properties:
                by:
                  type: string
                  description: Username that last edited the model.
                  example: smartinez_admin
            version:
              type: number
              description: The version of the model. Increments on each edit.
              example: 16.0
        triggeredComponents:
          type: array
          items:
            type: object
            properties:
              time:
                type: integer
                format: int64
                description: A timestamp in Epoch time at which the components were triggered.
                example: 1530000000000
              cbid:
                type: number
                description: The "component breach id". A unique identifier for the specific instance of triggered component.
                example: 1729.0
              cid:
                type: integer
                format: int64
                description: The "component id". A unique identifier.
                example: 1
              chid:
                type: integer
                format: int64
                description: The "component history id". Increments when the component is edited.
                example: 1
              size:
                type: integer
                format: int64
                description: The size of the value that was compared in the component.
                example: 1155203452
              threshold:
                type: integer
                format: int64
                description: The threshold value that the size must exceed for the component to trigger.
                example: 1073741824
              interval:
                type: integer
                format: int64
                description: The timeframe in seconds within which the threshold must be satisfied.
                example: 3600
              logic:
                type: object
                description: An object describing the component logic.
                properties:
                  data:
                    type: object
                    description: An object representing the logical relationship between component filters. Each filter is
                      given an alphabetical reference and the contents of this object describe the relationship between those
                      objects.
                    properties:
                      left:
                        type: string
                        description: Objects on the left will be compared with the object on the right using the specified
                          operator.
                        example: A
                      operator:
                        type: string
                        description: A logical operator to compare filters with.
                        example: AND
                      right:
                        type: object
                        description: Objects on the left will be compared with the object on the right using the specified
                          operator.
                  version:
                    type: string
                    description: The version of the component logic.
                    example: v0.1
              metric:
                type: object
                description: An object describing the metric used in the component that triggered the model alert.
                properties:
                  mlid:
                    type: integer
                    format: int64
                    description: The "metric logic" id - unique identifier.
                    example: 33
                  name:
                    type: string
                    description: The metric which data is returned for in system format.
                    example: externalclientdatatransfervolume
                  label:
                    type: string
                    description: The metric which data is returned for in readable format.
                    example: External Data Volume as a Client
              device:
                type: object
                description: An object describing a device seen by Darktrace.
                properties:
                  did:
                    type: integer
                    format: int64
                    description: The "device id", a unique identifier.
                    example: 96
                  ip:
                    type: string
                    description: The current IP associated with the device.
                    example: 10.0.18.224
                  ips:
                    type: array
                    items:
                      type: object
                      properties:
                        ip:
                          type: string
                          description: A historic IP associated with the device.
                          example: 10.0.18.224
                        timems:
                          type: integer
                          format: int64
                          description: The time the IP was last seen associated with that device in epoch time.
                          example: 1528812000000
                        time:
                          type: string
                          description: The time the IP was last seen associated with that device in readable format.
                          example: '2018-06-12 14:00:00'
                        sid:
                          type: integer
                          format: int64
                          description: The subnet id for the subnet the IP belongs to.
                          example: 34
                    description: IPs associated with the device historically.
                  sid:
                    type: integer
                    format: int64
                    description: The subnet id for the subnet the device is currently located in.
                    example: 34
                  hostname:
                    type: string
                    description: The current device hostname.
                    example: fs182
                  firstSeen:
                    type: integer
                    format: int64
                    description: The first time the device was seen on the network.
                    example: 1528810000000
                  lastSeen:
                    type: integer
                    format: int64
                    description: The last time the device was seen on the network.
                    example: 1528810000000
                  typename:
                    type: string
                    description: The device type in system format.
                    example: server
                  typelabel:
                    type: string
                    description: The device type in readable format.
                    example: Server
              triggeredFilters:
                type: array
                items:
                  type: object
                  properties:
                    cfid:
                      type: number
                      description: The 'component filter id'. A unique identifier for the filter as part of a the component.
                      example: 1.0
                    id:
                      type: string
                      description: A filter that is used in the component logic. All filters are given alphabetical identifiers.
                        Display filters - those that appear in the model alert notification - can be identified by a lowercase
                        'd' and a numeral.
                      example: A
                    filterType:
                      type: string
                      description: The filtertype that is used in the filter. A full list of filtertypes can be found on the
                        /filtertypes endpoint.
                      example: Direction
                    arguments:
                      type: object
                      description: An object describing the values and comparisons made in the filter.
                      properties:
                        value:
                          type: string
                          description: The value the filtertype should be compared against (using the specified comparator)
                            to create the filter.
                          example: out
                    comparatorType:
                      type: string
                      description: The comparator. A full list of comparators available for each filtertype can be found on
                        the /filtertypes endpoint.
                      example: is
                    trigger:
                      type: object
                      description: An object containing the value to be compared. Display filters will have an empty object.
                      properties:
                        value:
                          type: string
                          description: The actual value that triggered the filter.
                          example: out
                description: The filters that comprise the component that were triggered to produce the model alert.
          description: An array describing the model components that were triggered to create the model alert.
        score:
          type: number
          description: The model alert score, represented by a value between 0 and 1.
          example: 0.443
        percentscore:
          type: number
          description: The model alert score as a simple percentage equivalent.
          example: 44.0
