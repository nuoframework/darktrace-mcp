          type: number
          description: The device id of the source device. Will only appear if the source device has been observed by Darktrace.
          example: 29.0
        ddid:
          type: number
          description: The device id of the destination device. Will only appear if the destination device has been observed
            by Darktrace.
          example: 3765.0
        port:
          type: integer
          format: int64
          description: In the majority of cases, the destination port connected to.
          example: 443
        sourcePort:
          type: number
          description: The port connected from on the source device.
          example: 22.0
        destinationPort:
          type: number
          description: The port connected to on the destination device.
          example: 443.0
        direction:
          type: string
          description: The direction of the connection.
          example: in
        applicationprotocol:
          type: string
          description: The application protocol used in the connection as derived by Darktrace.
          example: HTTPS
        protocol:
          type: string
          description: The network protocol used for the connection as derived by Darktrace.
          example: TCP
        sourceDevice:
          type: object
          description: An object describing the source device. There are multiple formats this may take, please see the separate
            sourceDevice object schemas.
        destinationDevice:
          type: object
          description: An object describing the destination device. There are multiple formats this may take, please see the
