  /deviceinfo:
    get:
      tags:
      - deviceinfo
      summary: GET /deviceinfo
      operationId: get_deviceinfo
      description: 'The /deviceinfo endpoint returns the data used in the "Connections Data" view for a specific device that
        can be accessed from the Threat Visualizer omnisearch. The data returned covers a 4 week period.


        **Notas (doc oficial):** The minimum time interval width is 1 hour. A value greater than 1 can be specified with intervalhours
        to create a larger interval for connection grouping. Setting showallgraphdata to false will remove empty time intervals
        with from the returned data - this can be helpful to reduce noise. To get external connectivity, use odid=0 in the
        request parameters. This will add additional information to the response JSON about the external locations accessed.
        Only the top results across the four week interval will be returned - results below a certain threshold will be grouped
        into an ''others'' category. Restricting the data to a domain or adding similar devices will change the structure
        of the returned JSON. fulldevicedetails=true will add a devices object with full details of the devices connected
        to and the device specified Specifying a number of similar devices to return will result in multiple objects in the
        deviceinfo array.


