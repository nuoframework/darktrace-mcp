openapi: 3.0.3
info:
  title: Darktrace Threat Visualizer API
  version: '6.1'
  description: 'Schema OpenAPI generado a partir de la documentación oficial del Darktrace Customer Portal (Threat Visualizer
    API, documentada para 6.1).


    ## Autenticación

    Cada petición requiere tres cabeceras:

    - `DTAPI-Token`: token público.

    - `DTAPI-Date`: fecha/hora actual (±30 min respecto al servidor, UTC), p. ej. `20230101T120000` o `2023-01-01 12:00:00`.

    - `DTAPI-Signature`: `HMAC-SHA1(private_token, "<path+query>\n<public_token>\n<date>")` en hex.


    El `<path+query>` es la ruta con su query string exactamente como se envía (sin host). Para POST, los parámetros/JSON
    del cuerpo se añaden a la cadena firmada como query: `/endpoint?param1=v1&param2=v2` o `/endpoint?{"param1":"v1"}`.


    Las respuestas varían según parámetros (`minimal`, `fulldevicedetails`, `deviceattop`, `historicmodelonly`, `responsedata`...);
    los schemas reflejan las tablas de la documentación, que Darktrace describe como no exhaustivas.'
  x-source: https://customerportal.darktrace.com/guides/api-tokens
servers:
- url: https://{instance}
  variables:
    instance:
      default: darktrace.example.com
      description: IP o FQDN del master/instancia, p. ej. euw1-1234-01.cloud.darktrace.com
security:
- DTAPIToken: []
  DTAPIDate: []
  DTAPISignature: []
tags:
- name: advancedsearch
- name: aianalyst
- name: antigena
- name: components
- name: cves
