      - antigena
      summary: GET /antigena/summary
      operationId: get_antigena_summary
      description: 'The /summary extension of the /antigena endpoint is a simple summary of active and pending Darktrace Autonomous
        Response actions. If a time window is not specified, the request will return the state of actions now. If queried
        with a time window, the endpoint will return information about active actions during that time window.


        **Notas (doc oficial):** This endpoint only identified devices by their system id - did . This value can be used to
        query /devices for more information. Historic information about which actions were pending at a given point in time
        is not available from this endpoint. Pending action information is only returned if starttime / endtime parameters
        are not specified, and is only valid for the time of query. This information should instead by sought from the /antigena
        endpoint using the includehistory parameter to include full information about action state over time. Time parameters
        must always be specified in pairs. The endpoint will return information about all devices with active actions during
        the timeframe - information about when those specific actions were active, and for how long, is not included. It is
        therefore recommended that small time periods are queried. For more complex queries, the /antigena endpoint is recommended.
        A device may have more than one active or pending against it - the number of actions may therefore not match the total
        number of impacted devices.


        **Permiso mínimo (GET):** Unrestricted Devices¹ and Visualizer


        Documentación: https://customerportal.darktrace.com/guides/api-antigena-summary-request'
