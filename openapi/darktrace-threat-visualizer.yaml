  /modelbreaches:
    get:
      tags:
      - modelbreaches
      summary: GET /modelbreaches
      operationId: get_modelbreaches
      description: 'The /modelbreaches endpoint returns a time-sorted list of model alerts, filtered by the specified parameters.
        This endpoint is the most important for organizations who wish to integrate Darktrace programmatically into their
        SOC environment.


        **Notas (doc oficial):** A time window for the returned model alerts can be specified using YYYY-MM-DD HH:MM:SS format
        with the to / from parameters, or starttime / endtime using unix time. If no time period is specified, model alerts
        are pulled from beginning of memory with a limit of one year per response. Time parameters must always be specified
        in pairs. Time parameters limit data by the timestamp of the first activity that was relevant to the model alert,
        not the eventual model alert record creation. To filter on model alert creation, use creationtime=true . This time
        difference may be due to models which require multiple events over a long period, or may be due to events received
        with a delay from third-party platforms. Specifying historicmodelonly will return a single model object for the model
        entity at the time of alert creation. The includebreachURL parameter will only return a URL if minimal=false . This
        URL will be the second object returned and it will take the format "breachUrl": "https://darktrace-dt-XXX-YY/#modelbreach/123"
        expandenums toggles numeric values in certain nested lists to full strings - the numerical codes and associated strings
        for enums can be found at the /enums endpoint ( /enums ). By default, the minimal parameter is false when accessing
        model alerts programmatically. This returns reduced model logic details for the model that triggered a model alert.
        The /modelbreaches endpoint in the Threat Visualizer has minimal=true by default for multiple model alerts and minimal=false
        when filtering by a pbid . Setting minimal to false will allow more investigation in the external environment but
        will also produce more noise in the returned JSON. By default, the deviceattop parameter is true when accessing model
        alerts programmatically. This means device information is contained in a top level JSON object " device ", rather
        than contained within the triggeredComponents object. The /modelbreaches endpoint in the Threat Visualizer has deviceattop=false
        by default, so device information is nested within the triggeredComponents object when viewed with a browser. Alert
        priority is only returned when minimal=false and cannot be used as a filter for returned model alerts. The parameter
        group=device can be used to sort returned model alerts by the triggering device and mimic the "Device" view of the
        Threat Tray. In this mode, the score (and devicescore ) value will represent the device score associated with the
        model alert. The model alert score is instead indicated by pbscore . If a model triggers model alerts too frequently,
        it will be automatically suppressed (if suppression is enabled). Suppressed model alerts are not displayed to Threat
        Visualizer users as standard. The parameter includesuppressed will include these suppressed model alerts in the output.
        The uuid value is unique and consistent for models across Darktrace environments. The pid value is unique only within
        the context of the given instance. The saasfilter parameter takes a wildcard string which is matched to the SaaS::[platform]
        value (e.g. SaaS::Office365 ). Multiple filters can be applied to include multiple modules - for example, saasfilter=gcp*&saasfilter=office365*
        . A wildcard ( * ) must be specified at the end of this parameter value.


        **Permiso mínimo (GET):** Unrestricted Devices¹ and any of : Visualizer/Darktrace ⁄ IDENTITY Console/View Models/Edit
        Models


        Documentación: https://customerportal.darktrace.com/guides/api-modelbreaches-request'
      parameters:
      - name: deviceattop
        in: query
        required: false
        description: Return the device JSON object as a value of the top-level object rather than within each matched component.
          Defaults to true in the Threat Visualizer UI and in JSON alert formats and false for the programmatic API. requests.
        schema:
          type: boolean
      - name: did
        in: query
        required: false
        description: Identification number of a device modelled in the Darktrace system.
        schema:
          type: integer
          format: int64
      - name: endtime
        in: query
        required: false
        description: End time of data to return in millisecond format, relative to midnight January 1st 1970 UTC.
        schema:
          type: integer
          format: int64
      - name: expandenums
        in: query
        required: false
        description: Expand numeric enumerated types to their descriptive string representation.
        schema:
          type: boolean
      - name: from
        in: query
        required: false
        description: Start time of data to return in YYYY-MM-DD HH:MM:SS format.
        schema:
          type: string
      - name: historicmodelonly
        in: query
        required: false
        description: Return the JSON for the historic version of the model details only, rather than both the historic and
          current definition.
        schema:
          type: boolean
      - name: includeacknowledged
        in: query
        required: false
        description: Include acknowledged model alerts in the data.
        schema:
          type: boolean
      - name: includebreachurl
        in: query
        required: false
        description: Return a URL for the model alert in the long form of the model alert data, this requires that the FQDN
          configuration parameter is set.
        schema:
          type: boolean
      - name: minimal
        in: query
        required: false
        description: Reduce the amount of data returned for the API call. In the Threat Visualizer, this parameter defaults
          to false when any of the starttime , from , pid , uuid , pbid or did parameters are used. When accessed programmatically,
          always defaults to false.
        schema:
          type: boolean
      - name: minscore
        in: query
        required: false
        description: Return only model alerts with a minimum score.
        schema:
          type: number
      - name: pbid
        in: query
        required: false
        description: Only return the model alert with the specified ID.
        schema:
          type: integer
          format: int64
      - name: pid
        in: query
        required: false
        description: Only return model alerts for the specified model.
        schema:
          type: integer
          format: int64
      - name: starttime
        in: query
        required: false
        description: Start time of data to return in millisecond format, relative to midnight January 1st 1970 UTC.
        schema:
          type: integer
          format: int64
      - name: to
        in: query
        required: false
        description: End time of data to return in YYYY-MM-DD HH:MM:SS format
        schema:
          type: string
      - name: uuid
        in: query
        required: false
        description: Only return model alerts for the specified model. All models have a uuid and a pid. The uuid (universally
          unique identifier) is a 128-bit hexadecimal number.
        schema:
          type: string
      - name: responsedata
        in: query
        required: false
        description: When given the name of a top-level field or object, restricts the returned JSON to only that field or
          object.
        schema:
          type: string
      - name: saasonly
        in: query
        required: false
        description: Restricts returned model alerts to only those involving a user observed by a Darktrace ⁄ IDENTITY and/or
          Darktrace ⁄ CLOUD module.
        schema:
          type: boolean
      - name: group
        in: query
        required: false
        description: If group=device is used, modifies the score field to display the device score.
        schema:
          type: string
      - name: includesuppressed
        in: query
        required: false
        description: Includes suppressed model alerts in the response. Default false .
        schema:
          type: boolean
      - name: saasfilter
        in: query
        required: false
        description: Can be used to limit returned model alerts to specific Darktrace ⁄ IDENTITY or Darktrace ⁄ CLOUD module
          users. Can be repeated multiple times.
        schema:
          type: array
          items:
            type: string
        explode: true
      - name: creationtime
        in: query
        required: false
        description: When true , alters the behavior of time parameters to filters based on model alert creation. When false
          (default), time filtering will instead limit by the timestamp of the first relevant activity to the model logic.
        schema:
          type: boolean
      responses:
        '200':
          description: 'OK. Variantes de respuesta documentadas según parámetros: `ModelbreachesNoParameters` (Response Schema
            - No Parameters), `ModelbreachesDeviceattopFalse` (Response Schema - deviceattop=false), `ModelbreachesHistoricmodelonlyTrue`
            (Response Schema - historicmodelonly=true), `ModelbreachesHistoricmodelonlyTrueDeviceattopFalse` (Response Schema
            - historicmodelonly=true&deviceattop=false), `ModelbreachesHistoricmodelonlyTrueDeviceattopFalseMinimalTrue` (Response
            Schema - historicmodelonly=true&deviceattop=false - minimal=true), `ModelbreachesMinimalTrueDeviceattopFalse`
            (Response Schema - minimal=true&deviceattop=false), `ModelbreachesMinimalTrueDeviceattopFalseMinimalTrueHistoricmodelonlyTrue`
            (Response Schema - minimal=true&deviceattop=false - minimal=true&historicmodelonly=true)'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelbreachesNoParameters'
        '400':
          description: Petición inválida (p. ej. INPUT ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Firma, token o fecha (DTAPI-Date) inválidos
        '403':
          description: El usuario del token no tiene el permiso requerido
