      operationId: get_aianalyst_investigations
      description: 'The /aianalyst/investigations endpoint returns manual Cyber AI Analyst investigations launched by users
        from the Threat Visualizer ( Triggered Cyber AI Analyst Investigations ), Mobile App ([Cyber AI Analyst Investigations])(mobile-app-ai-analyst-investigations),
        or via the API. It can also be used to create new manual investigations.


        **Notas (doc oficial):** Once a Darktrace Cyber AI Analyst investigation is created, the result will not be instantaneous.
        Regular GET requests should be made to the /aianalyst/investigations endpoint - optionally with the investigationId
        of the created investigation - until the status key displays finished . The investigationId is provided in the response
        to a valid POST request to this endpoint. Successful investigations will return an object inside the incidents array
        with a uuid and array of related model alerts in pbid format. To review the Cyber AI Analyst incident the event is
        associated with - including whether there are other events found - query the /aianalyst/groups endpoint with the uuid
        value described above in the format uuid=[uuid] . For example, /aianalyst/groups?uuid=af763617-2626-4e4c-84fc-e03d5cd8e6c8
        . To review the specific incident event created by the investigation in more detail, query the /aianalyst/incidentevents
        endpoint using the uuid value in the format /aianalyst/incidentevents?uuid=[uuid] . For example, /aianalyst/incidentevents?uuid=af763617-2626-4e4c-84fc-e03d5cd8e6c8
        . To review the related model alerts, the numeric values from the related array (within incidents array objects) can
        be provided to the /modelbreaches endpoint in the format /modelbreaches/[pbid] or /modebreaches?pbid=[pbid1],[pbid2]
        . One related model alert will always be the system AI Analyst::AI Analyst Investigation model which is used to trigger
        investigations. The top level pbid field in the response also refers to this system model only, and cannot be used
        to review standard associated model alerts. investigateTime defines the time period Cyber AI Analyst should investigate
        the device at, not the time the investigation was created at. When an investigation is triggered, Cyber AI Analyst
        will perform a close analysis of the activity for the device or user for a period of roughly one hour, using the time
        provided as a central point.


        **Permiso mínimo (GET):** N/A


        Documentación: https://customerportal.darktrace.com/guides/api-aianalyst-investigations-request'
