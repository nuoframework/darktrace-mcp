              name:
                type: string
                description: The system message text.
                example: IP range excluded
          description: An array of system messages that may be fired as notices.
        Internal source device type:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: The system code for the device type.
                example: '2'
              name:
                type: string
                description: The readable device type.
                example: Laptop
          description: An array of device types that an internal source device may be identified as.
        Internal destination device type:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: The system code for the device type.
                example: '2'
              name:
                type: string
                description: The readable device type.
                example: Laptop
          description: An array of device types that an internal destination device may be identified as.
        Protocol:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: The system code for the protocol.
                example: '1'
              name:
                type: string
                description: The readable protocol name.
                example: ICMP
          description: An array of network protocols that may be identified within the network.
        Application protocol:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: The system code for the protocol.
                example: '1053'
              name:
                type: string
                description: The readable protocol name.
                example: BITTORRENT
          description: An array of application protocols that may be identified within the network.
        Malformed traffic type:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: The system code for the traffic type.
                example: bad_HTTP_reply
              name:
                type: string
                description: The readable traffic type.
                example: Bad HTTP reply
          description: An array of types of malformed traffic which may be detected in the traffic fed to Darktrace, and their
            corresponding system codes.
        Vendor:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: The system code for the vendor.
                example: '-16579579'
              name:
                type: string
                description: The actual vendor name.
                example: Cisco Systems, Inc
          description: An array of network card vendors and their corresponding system codes.
        Destination Resource Type:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: The system code for the resource type.
                example: File
              code:
                type: string
                description: The readable resource type.
                example: File
          description: An array of destination resource types for resources in external platforms.
        Access Method:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: The system code for the access type.
                example: API
              code:
                type: string
                description: The readable access method.
                example: API
          description: An array of access method types for resources in external platforms.
        Resource Type:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: The system code for the resource type.
                example: File
              code:
                type: string
                description: The readable resource type.
                example: File
          description: An array of resource types for resources in external platforms.
        Action Direction:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: The system code for the action direction.
                example: Outbound
              code:
                type: string
                description: The readable direction.
                example: Outbound
          description: An array of action directions that a user actor can perform - denotes whether the action was performed
            by or performed on a user.
      title: /enums — Response Schema
      description: 'Fuente: https://customerportal.darktrace.com/guides/api-enums-schema'
    Filtertypes:
