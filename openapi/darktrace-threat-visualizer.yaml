          type: string
      - name: cloudsecurity
        in: query
        required: false
        description: When true, limits the devices returned to those identified by Darktrace ⁄ CLOUD.
        schema:
          type: boolean
      - name: saasfilter
        in: query
        required: false
        description: Can be used to limit returned devices to specific Darktrace ⁄ IDENTITY or Darktrace ⁄ CLOUD module users.
          Can be repeated multiple times.
        schema:
          type: array
          items:
            type: string
        explode: true
      responses:
        '200':
          description: 'OK. Variantes de respuesta documentadas según parámetros: `DevicesNetworkDevice` (Response Schema
            - Network Device), `DevicesDarktraceIDENTITYDevice` (Response Schema - Darktrace ⁄ IDENTITY Device), `DevicesIncludetagsTrue`
            (Response Schema - includetags=true)'
