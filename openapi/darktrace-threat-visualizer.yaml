        triggeredComponents:
          type: array
          items:
            type: object
            properties:
              time:
                type: integer
                format: int64
                description: A timestamp in Epoch time at which the components were triggered.
                example: 1528810000000
              cbid:
                type: number
                description: The "component breach id". A unique identifier for the specific instance of triggered component.
                example: 1729.0
              cid:
                type: integer
                format: int64
                description: The "component id". A unique identifier.
                example: 1
              chid:
                type: integer
                format: int64
                description: The "component history id". Increments when the component is edited.
                example: 1
              size:
                type: integer
                format: int64
                description: The size of the value that was compared in the component.
                example: 1155203452
              threshold:
                type: integer
                format: int64
                description: The threshold value that the size must exceed for the component to trigger.
                example: 1073741824
              interval:
                type: integer
                format: int64
                description: The timeframe in seconds within which the threshold must be satisfied.
                example: 3600
              logic:
                type: object
                properties:
                  data:
                    type: object
                    description: An object representing the logical relationship between component filters. Each filter is
                      given an alphabetical reference and the contents of this object describe the relationship between those
                      objects.
                    properties:
                      left:
                        type: string
                        description: Objects on the left will be compared with the object on the right using the specified
                          operator.
                        example: A
                      operator:
                        type: string
                        description: A logical operator to compare filters with.
                        example: AND
                      right:
                        type: object
                        description: Objects on the left will be compared with the object on the right using the specified
                          operator.
                  version:
                    type: string
                    description: The version of the component logic.
                    example: v0.1
              metric:
                type: object
                description: An object describing the metric used in the component that triggered the model alert.
                properties:
                  mlid:
                    type: integer
                    format: int64
                    description: The "metric logic" id - unique identifier.
                    example: 33
                  name:
                    type: string
                    description: The metric which data is returned for in system format.
                    example: externalclientdatatransfervolume
                  label:
                    type: string
                    description: The metric which data is returned for in readable format.
                    example: External Data Volume as a Client
              triggeredFilters:
                type: array
                items:
                  type: object
                  properties:
                    cfid:
                      type: number
                      description: The 'component filter id'. A unique identifier for the filter as part of a the component.
                      example: 1.0
                    id:
                      type: string
                      description: A filter that is used in the component logic. All filters are given alphabetical identifiers.
                        Display filters - those that appear in the model alert notification - can be identified by a lowercase
                        'd' and a numeral.
                      example: A
                    filterType:
                      type: string
                      description: The filtertype that is used in the filter. A full list of filtertypes can be found on the
                        /filtertypes endpoint.
                      example: Direction
                    arguments:
                      type: object
                      description: An object describing the values and comparisons made in the filter.
                      properties:
                        value:
                          type: number
                          description: The value the filtertype should be compared against (using the specified comparator)
                            to create the filter.
                    comparatorType:
                      type: string
                      description: The comparator. A full list of comparators available for each filtertype can be found on
                        the /filtertypes endpoint.
                      example: is
                    trigger:
                      type: object
                      description: An object contaning the value to be compared. Display filters will have an empty object.
                      properties:
                        value:
                          type: string
                          description: The actual value that triggered the filter.
                          example: out
                description: The filters that comprise the component that were triggered to produce the model alert.
          description: An array describing the model components that were triggered to create the model alert.
        score:
          type: number
          description: The model alert score, represented by a value between 0 and 1.
          example: 0.443
        percentscore:
          type: number
          description: The model alert score as a simple percentage equivalent.
          example: 44.0
        device:
          type: object
          description: An object describing a device seen by Darktrace.
          properties:
            did:
              type: integer
              format: int64
              description: The "device id", a unique identifier.
              example: 96
            ip:
              type: string
              description: The current IP associated with the device.
              example: 10.0.18.224
            ips:
              type: array
              items:
                type: object
                properties:
                  ip:
                    type: string
                    description: A historic IP associated with the device.
                    example: 10.0.18.224
                  timems:
                    type: integer
                    format: int64
                    description: The time the IP was last seen associated with that device in epoch time.
                    example: 1528812000000
                  time:
                    type: string
                    description: The time the IP was last seen associated with that device in readable format.
                    example: '2020-02-12 12:00:00'
                  sid:
                    type: integer
                    format: int64
                    description: The subnet id for the subnet the IP belongs to.
                    example: 34
              description: IPs associated with the device historically.
            sid:
              type: integer
              format: int64
              description: The subnet id for the subnet the device is currently located in.
              example: 34
            hostname:
              type: string
              description: The current device hostname.
              example: fs182
            firstSeen:
              type: integer
              format: int64
              description: The first time the device was seen on the network.
              example: 1528810000000
            lastSeen:
              type: integer
              format: int64
              description: The last time the device was seen on the network.
              example: 1528810000000
            typename:
              type: string
              description: The device type in system format.
              example: server
            typelabel:
              type: string
              description: The device type in readable format.
              example: Server
