  /aianalyst/incidents:
    get:
      tags:
      - aianalyst
      summary: GET /aianalyst/incidents (deprecated)
      operationId: get_aianalyst_incidents
      description: 'The following endpoint is now considered legacy and is preserved for backwards compatibility. To request
        Cyber AI Analyst incidents from the API in Darktrace Threat Visualizer 5.2 and above, please use /aianalyst/groups
        and /aianalyst/incidentevents .


        **Notas (doc oficial):** A time window for the returned events can be specified using starttime / endtime and unix
        time in milliseconds. Where only endtime is set, starttime will default to 1 week before endtime . Where only starttime
        is set, endtime will default to the current time. If no time parameters are specified, events from the last seven
        days (and pinned events, if applicable) will be returned. Events that are pinned or part of pinned incidents will
        always be returned, regardless of the time period specified. This can be prevented with includeallpinned=false Where
        locale is not specified or not supported in the current software version, strings will default to en_GB . Where the
        specified locale uses non-ascii characters, these will be returned in unicode format and must be parsed. As of 5.2,
        cross-network events - events where more than one uuid may appear in the children array - are now deprecated. The
        mergeEvents parameter is no longer supported. The id field seen in the JSON response is a system field intended for
        use by the Threat Visualizer interface. Although for many event types the contents of the children field and the id
        field are consistent, some event types (such as cross-network events) utilize a pseudo-identifier in the id field
        which will not return data when used with the uuid parameter. As cross-network events are now deprecated, both values
        ( id or children ) can now be used. Links back to the Threat Visualizer can be included in the response with includeincidenturl=true
        . Please see the response schema for a full breakdown of the details array.


        **Permiso mínimo (GET):** Unrestricted Devices¹ and any of : Visualizer/Darktrace ⁄ IDENTITY Console


        Documentación: https://customerportal.darktrace.com/guides/api-aianalyst-incidents-request'
      deprecated: true
      parameters:
      - name: includeacknowledged
        in: query
        required: false
        description: Include acknowledged events in the data.
        schema:
          type: boolean
      - name: endtime
        in: query
        required: false
        description: End time of data to return in millisecond format, relative to midnight January 1st 1970 UTC.
        schema:
          type: integer
          format: int64
      - name: starttime
        in: query
        required: false
        description: Start time of data to return in millisecond format, relative to midnight January 1st 1970 UTC.
        schema:
          type: integer
          format: int64
      - name: locale
        in: query
        required: false
        description: The language for returned strings. Currently supported are de_DE (German), en_GB (English UK), en_US
          (English US), es_ES (Spanish ES), es_419 (Spanish LATAM), fr_FR (French), it_IT (Italian), ja_JP (Japanese), ko_KR
          (Korean) , pt_BR (Portuguese BR), zh_Hans (Chinese (Simplified)), zh_Hant (Chinese (Traditional))
        schema:
          type: string
      - name: uuid
        in: query
        required: false
        description: A unique identifier for a Cyber AI Analyst event. Takes multiple values comma-separated.
        schema:
          type: string
      - name: did
        in: query
        required: false
        description: Identification number of a device modelled in the Darktrace system.
        schema:
          type: integer
          format: int64
      - name: mergeEvents
        in: query
        required: false
        description: Cross-Network events are deprecated as of 5.2. This parameter is no longer available.
        schema:
          type: boolean
      - name: includeallpinned
        in: query
        required: false
        description: True by default. Controls whether pinned events are returned alongside those from the timeframe specified.
        schema:
          type: boolean
      - name: includeincidenturl
        in: query
