                description: An array of application protocols used in the connections.
          description: An array of statistics about the connections made by the device or subnet. Regardless of the metric
            specified, these statistics will always relate to data transfer volumes.
        subnets:
          type: array
          items:
            type: object
            properties:
              sid:
                type: integer
                format: int64
                description: The subnet id for the other subnet.
                example: -6
              size:
                type: integer
                format: int64
                description: The amount of data transferred to or from that subnet.
                example: 966432307
              timems:
                type: integer
                format: int64
                description: A timestamp at which the data was gathered in epoch time.
                example: 1586937881000
              network:
                type: string
                description: The network range describing the subnet.
              label:
                type: string
                description: The subnet label applied in Subnet Admin (if applicable).
                example: Internal Traffic
          description: An array of subnets that have interacted with the subnet.
        devices:
          type: array
          items:
            type: object
            properties:
              did:
                type: integer
                format: int64
                description: The "device id" of the device.
                example: 54
              size:
                type: integer
                format: int64
                description: Depending on the metric specified, the amount of data transferred in the connections involving
                  that device or the number of matching connections.
                example: 153541
              timems:
                type: integer
                format: int64
                description: A timestamp at which the data was gathered in epoch time.
                example: 1586937881000
              ips:
                type: array
                items: {}
                description: IPs associated with the device historically.
              sid:
                type: integer
                format: int64
                description: The subnet id for the subnet the device is currently located in.
                example: 82
              ip:
                type: string
                description: The current IP associated with the device.
                example: 10.12.14.2
              network:
                type: string
                description: The IP address range that describes the subnet the IP is contained within
                example: 10.12.14.0/24
          description: When a subnet is specified, information about the devices within that subnet and any devices they have
            communicated with.
        metric:
          type: object
          description: An object describing the metric queried upon.
          properties:
            mlid:
              type: integer
              format: int64
              description: The "metric logic" id - unique identifier.
              example: 17
            name:
              type: string
              description: The metric which data is returned for in system format.
              example: datatransfervolume
            label:
              type: string
              description: The metric which data is returned for in readable format.
              example: Data Transfer
            units:
              type: string
              description: The units the metric is measured in, if applicable.
              example: bytes
            filtertypes:
              type: array
              items: {}
              description: An array of filters which can be used with this metric.
            unitsinterval:
              type: number
              description: The default time interval for the metric.
              example: 3600.0
            lengthscale:
              type: number
              description: A system field.
              example: 599997600.0
        connections:
          type: array
          items:
            type: object
            properties:
              source:
                type: object
                description: An object describing the source of a connection.
                properties:
                  id:
                    type: number
                    description: The device id or subnet id of the source of the connection, where applicable.
                    example: -6.0
                  ip:
                    type: string
                    description: The IP of the source device.
                    example: 10.12.14.2
                  type:
                    type: string
                    description: The type of device, host or entity originating the connection.
                    example: subnet
              target:
                type: object
                description: An object describing the source of a target.
                properties:
                  id:
                    type: number
                    description: The device id or subnet id of the destination for the connection, where applicable.
                    example: -6.0
                  ip:
                    type: string
                    description: The IP of the target device.
                    example: 10.0.18.224
                  type:
                    type: string
                    description: The type of device, host or entity targeted by the connection.
                    example: subnet
              timems:
                type: integer
                format: int64
                description: A timestamp for the connection in epoch time.
                example: 1586937600000
              score:
                type: number
                description: Where a connection is deemed unusual, the percentage unusualness of the connection.
                example: 18.0
              size:
                type: integer
                format: int64
                description: The time frame covered by the initial request in seconds x 10000.
                example: 36000000
          description: An array of connection objects associated with the subnet and metric over the time period.
      title: /network — Response Schema = viewsubnet
      description: 'Fuente: https://customerportal.darktrace.com/guides/api-network-schema'
    Pcaps:
      type: object
      properties:
        tmqid:
          type: integer
          format: int64
          description: A unique identifier - tm query ID - for the packet capture.
          example: 119
        startTime:
          type: integer
          format: int64
          description: The start time at which the generation of the PCAP began in epoch time.
          example: 1613122702
        endTime:
          type: integer
          format: int64
          description: The end time at which the generation of the PCAP was completed in epoch time.
          example: 1613122715
        filename:
          type: string
          description: The filename of the packet capture which can be used to retrieve it. When retrieving via the API, the
            /tm prefix should be omitted.
          example: /tm/DCIP_20210209121522_20210209122523_192_168_0_4_60527_10_10_10_22_443_tcp_qnXkZE_m.pcap
        index:
          type: string
          description: A system field.
          example: connection4
        l3proto:
          type: string
          description: The layer three protocol of the PCAP, if specified during creation.
          example: tcp
        ip1:
          type: string
          description: The source IP of connections in the packet capture.
          example: 192.168.0.4
        port1:
          type: number
          description: The source port of connections in the packet capture, if specified during creation.
          example: 60527.0
        ip2:
          type: string
          description: The destination IP of connections in the packet capture, if specified during creation.
          example: 10.10.10.22
        port2:
          type: number
          description: The destination port of connections in the packet capture, if specified during creation.
          example: 443.0
        start:
          type: integer
          format: int64
          description: The start time of the packet capture in epoch time.
          example: 1612872922
        end:
          type: integer
          format: int64
          description: The end time of the packet capture in epoch time.
          example: 1612873523
        state:
          type: string
          description: The current status of the packet capture request.
          example: finished
      title: /pcaps — Response Schema
      description: 'Fuente: https://customerportal.darktrace.com/guides/api-pcaps-schema'
