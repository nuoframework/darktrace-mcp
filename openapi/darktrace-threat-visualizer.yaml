        a * . The removeall parameter will remove all watched domain entries, regardless of source.


        **Permiso mínimo (GET):** Edit Domains


        Documentación: https://customerportal.darktrace.com/guides/api-intelfeed-request'
      parameters:
      - name: source
        in: query
        required: false
