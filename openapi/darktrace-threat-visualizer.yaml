      operationId: post_antigena_manual
      description: 'The /antigena/manual endpoint can be used to create manual Darktrace ⁄ NETWORK Autonomous Response actions
        from Darktrace Threat Visualizer 6.


        **Notas (doc oficial):** The action reason and the username associated with the API token and will appear in the action
        history in the Threat Visualizer. These values are also returned from /antigena as triggerer.username and triggerer.reason
