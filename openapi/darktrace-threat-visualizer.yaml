      description: 'Detailed system health information from the Status page can be accessed programmatically with the /status
        API endpoint. This endpoint is ideal for monitoring in a NOC environment.


        **Notas (doc oficial):** The fast=true parameter will return any currently available data and will not query for subnet
        connectivity. However, as /status data is cached for a short period, a request with fast=true may sometimes return
        subnet connectivity information if a request has recently been made. The responsedata can be utilized to return only
        information about probes, subnets or to retrieve a specific desired field only. In Unified View environments, information
        about subordinate master instances under the UV will return in an instances object.


        **Permiso mínimo (GET):** Status


        Documentación: https://customerportal.darktrace.com/guides/api-status-request'
