          description: If an internal IP, this field will return "internal_ip"
          example: internal_ip
        longitude:
          type: number
          description: The longitude value provided to Subnet Admin which is used to plot the subnet on a map.
          example: -0.01
        latitude:
          type: number
          description: The latitude value provided to Subnet Admin which is used to plot the subnet on a map.
          example: 0.01
        devices:
          type: array
          items:
            type: object
            properties:
              did:
                type: integer
                format: int64
                description: The "device id", a unique identifier.
                example: 228
              ip:
                type: string
                description: The current IP associated with the device.
                example: 10.12.14.2
              ips:
                type: array
                items:
                  type: object
                  properties:
                    ip:
                      type: string
                      description: A historic IP associated with the device.
                      example: 10.12.14.2
                    timems:
                      type: integer
                      format: int64
                      description: The time the IP was last seen associated with that device in epoch time.
                      example: 1586937600000
                    time:
                      type: string
                      description: The time the IP was last seen associated with that device in readable format.
                      example: '2020-04-15 08:00:00'
                    sid:
                      type: integer
                      format: int64
                      description: The subnet id for the subnet the IP belongs to.
                      example: 14
                description: IPs associated with the device historically.
              sid:
                type: integer
                format: int64
                description: The subnet id for the subnet the device is currently located in.
                example: 14
              hostname:
                type: string
                description: The current device hostname.
                example: ws83
              firstSeen:
                type: integer
                format: int64
                description: The first time the device was seen on the network.
                example: 1582720000000
              lastSeen:
                type: integer
                format: int64
                description: The last time the device was seen on the network.
                example: 1584990000000
              os:
                type: string
                description: The device operating system if Darktrace is able to derive it.
                example: Windows NT kernel
              typename:
                type: string
                description: The device type in system format.
                example: desktop
              typelabel:
                type: string
                description: The device type in readable format.
                example: Desktop
          description: An array of devices that have connected to the IP.
      title: /endpointdetails — Response Schema - ip=[internal IP] - devices=true
      description: 'Fuente: https://customerportal.darktrace.com/guides/api-endpointdetails-schema'
    Enums:
