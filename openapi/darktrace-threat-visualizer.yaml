          type: string
          description: The time that the Threat Visualizer software bundle was downloaded.
          example: '2023-12-24 18:33:11'
        bundleInstalledDate:
          type: string
          description: The time that the Threat Visualizer software bundle was installed.
          example: '2023-12-24 20:20:12'
        maximumOSSensors:
