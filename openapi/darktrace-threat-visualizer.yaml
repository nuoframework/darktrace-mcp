    AianalystGroups:
      type: object
      properties:
        id:
          type: string
          description: A unique id of the incident. Can be used as a value for the groupid parameter or to link to the incident
            in the Threat Visualizer user interface.
          example: g04a3f36e-4u8w-v9dh-x6lb-894778cf9633
        active:
          type: boolean
          example: true
        acknowledged:
          type: boolean
          description: Whether the incident has been acknowledged.
          example: false
        pinned:
          type: boolean
          description: Whether the incident is pinned.
          example: false
        userTriggered:
          type: boolean
          description: Whether any of the events in the incident were created due to a user-triggered investigation.
          example: false
        externalTriggered:
          type: boolean
          description: Whether any of the events in the incident were created due to an externally-triggered (telemetry) investigation.
          example: false
        previousIds:
          type: array
          items: {}
          description: g927442d7-c2f7-4ceb-9fa2-398169bb9bcf
        incidentEvents:
          type: array
          items:
            type: object
            properties:
              uuid:
                type: string
                description: A unique id of the incident. Can be used as a value for the groupid parameter or to link to the
                  incident in the Threat Visualizer user interface.
                example: 04a3f36e-4u8w-v9dh-x6lb-894778cf9633
              start:
                type: integer
                format: int64
                description: The start time of the activity covered by the event.
                example: 1702392635000
              title:
                type: string
                description: The title of the event.
                example: Unusual Internal Upload
              triggerDid:
                type: number
                description: The unique device id of the device that triggered the Cyber AI Analyst investigation that produced
                  the incident event. If the incident event is created from Darktrace ⁄ EMAIL activity, this field will not
                  be populated.
                example: 1044.0
              sender:
                type: string
                description: If the incident event is created from Darktrace ⁄ EMAIL activity, this field will be populated
                  with an email address representing the sender of the anomalous email or email campaign investigated.
                example: example@example.com
              visible:
                type: boolean
                description: A system field.
                example: true
              acknowledged:
                type: boolean
                description: Whether the specific incident event has been acknowledged.
                example: true
          description: An array of the events that make up this incident. More detailed information can be retrieved from
            /incidentevents using the uuid values provided here.
        mitreTactics:
          type: array
          items: {}
          description: An array of MITRE ATT&CK Framework tactics that have been mapped to events contained within this incident.
        devices:
          type: array
          items: {}
          description: An array of unique device ids of devices that triggered the Cyber AI Analyst investigations for events
            contained within this incident.
        initialDevices:
          type: array
          items: {}
          description: The device(s) that initially triggered the first event under this incident.
        category:
          type: string
          description: The overall behavior category of the incident.
          example: critical
        groupScore:
          type: number
          description: The overall incident score of the incident.
          example: 99.93292997
        start:
          type: integer
          format: int64
          description: The start time of all activity covered by the incident events.
          example: 1702392635000
        end:
          type: integer
          format: int64
          description: The end time of all activity covered by the incident events.
          example: 1702392719930
        edges:
          type: array
          items:
            type: object
            properties:
              isAction:
                type: boolean
                description: A system field.
                example: false
              source:
                type: object
                description: An object describing the source of a pair of linking factors.
                properties:
                  nodeType:
                    type: string
                    description: The type of linking factor that linked the activity or information together.
                    example: device
                  value:
                    type: number
                    description: A value that represents the linking factor. Here, a unique device id.
                    example: 1044.0
              target:
                type: object
                description: An object describing the target of a pair of linking factors.
                properties:
                  nodeType:
                    type: string
                    description: The type of linking factor that linked the activity or information together.
                    example: internalIp
                  value:
                    type: string
                    description: A value that represents the linking factor. Here, an IP that corresponds to the unique device
                      ID.
                    example: 10.1.1.2
              start:
                type: number
                description: For time-based linked factors, a start time for the link.
              incidentEvent:
                type: string
                description: The incident event these linking factors relate to.
                example: 04a3f36e-4u8w-v9dh-x6lb-894778cf9633
              description:
                type: string
                description: If applicable, a description of the linking factor.
                example: Internal Upload
              details:
                type: array
                items: {}
                description: Additional details about the linking factor, if applicable.
          description: An array describing the links between events under this incident. This array is intended for use by
            the Threat Visualizer system.
      title: /aianalyst/groups — Response Schema
      description: 'Fuente: https://customerportal.darktrace.com/guides/api-aianalyst-groups-schema'
    AianalystIncidentevents:
      type: object
      properties:
        summariser:
          type: string
          description: In this case, the system name for the summarizer which identified the activity Cyber AI Analyst chose
            to surface to the end user. See above for more details.
          example: AdminConnSummary
        mitreTactics:
          type: array
          items: {}
          description: An array of MITRE ATT&CK Framework tactics that have been mapped to this event.
        acknowledged:
          type: boolean
          description: Whether the event has been acknowledged.
          example: false
        pinned:
          type: boolean
          description: Whether the event, or an incident that the event is associated with, is pinned within the Threat Visualizer
            user interface. Pinned events will always return regardless of the timeframe specified.
          example: true
        createdAt:
          type: number
          description: Timestamp for event creation in epoch time.
          example: 1702392635000.0
        attackPhases:
          type: array
          items: {}
          description: Of the six attack phases, which phases are applicable to the activity.
        title:
          type: string
          description: A title describing the activity that occurred.
          example: Extensive Unusual SSH Connections
        id:
          type: string
          description: A unique identifier that can be used to request this Cyber AI Analyst event.
          example: 04a3f36e-4u8w-v9dh-x6lb-894778cf9633
        children:
          type: array
          items: {}
          description: A unique identifier that can be used to request this Cyber AI Analyst event. This array will only contain
            one entry as of v5.2 and above.
        category:
          type: string
          description: The behavior category associated with the incident event. Relevant for v5.2+ incident construction
            only.
          example: critical
        currentGroup:
          type: string
          description: The UUID of the current incident this event belongs to. Used for v5.2+ incident construction.
          example: g04a3f36e-4u8w-v9dh-x6lb-894778cf9633
        groupCategory:
          type: string
          description: The behavior category associated with the incident overall. Relevant for v5.2+ incident construction
            only.
          example: critical
        groupScore:
          type: number
          description: The current overall score of the incident this event is part of. Relevant for v5.2+ incident construction
            only.
          example: 72.9174234
        groupPreviousGroups:
          description: If the incident event was part of an incident which was later merged with another, the UUIDs of the
            incidents before they were merged. Used for v5.2+ incident construction.
        activityId:
          type: string
          description: Used by pre-v5.2 legacy incident construction. An identifier for the specific activity detected by
            Cyber AI Analyst. If groupByActivity=true , this field should be used to group events together into an incident.
          example: da39a3ee
        groupingIds:
          type: array
          items: {}
          description: Used by pre-v5.2 legacy incident construction. Each entry in the groupingIDs array refers to a device
            that triggered the activity detection. In single events, should only contain one ID. If groupByActivity=false
            , this field should be used to group events together into an incident.
        groupByActivity:
          type: boolean
          description: Used by pre-v5.2 legacy incident construction. Indicates whether the event should be aggregated by
            activity or by device to create an incident. When true, the event should be aggregated by activityID, and when
            false, aggregated by groupingID(s).
          example: false
        userTriggered:
          type: boolean
          description: Whether the event was created as a result of a user-triggered Cyber AI Analyst investigation.
          example: false
        externalTriggered:
          type: boolean
          description: Whether the event was created as a result of an externally triggered Cyber AI Analyst investigation.
          example: false
        aiaScore:
          type: number
          description: The anomalousness of the event as classified by Cyber AI Analyst - out of 100.
          example: 98.0
        summary:
          type: string
          description: A textual summary of the suspicious activity.
          example: The device 10.1.2.3 was observed making unusual internal SSH connections to a wide range of devices...
        periods:
          type: array
          items:
            type: object
            properties:
              start:
                type: integer
                format: int64
                description: A timestamp for the start of the activity period in epoch time.
                example: 1702392635000
              end:
                type: integer
                format: int64
                description: A timestamp for the end of the activity period in epoch time.
                example: 1702392719930
          description: An array of one or more periods of time where anomalous activity occurred that Cyber AI Analyst investigated.
        sender:
          type: string
          description: If the incident event is created from Darktrace ⁄ EMAIL activity, this field will be populated with
            an email address representing the sender of the anomalous email or email campaign investigated. Otherwise, null.
          example: example@example.com
        breachDevices:
          type: array
          items:
            type: object
            properties:
              identifier:
                type: string
                description: An identifier for the device used when constructing summaries or reports. May be the device label,
                  hostname or IP, depending on availability.
                example: ws192.holdingsinc.com
              hostname:
                type: string
                description: The hostname associated with the device, if available.
                example: ws192.holdingsinc.com
              ip:
                type: string
                description: The IP associated with the device.
                example: 10.1.2.3
              mac:
                type: string
                description: The MAC address associated with the device.
              subnet:
                type: string
                description: The subnet label for the corresponding subnet, if available.
                example: VPN
              did:
                type: integer
                format: int64
                description: The unique "device id" identifier for the device that triggered the alert. This field is used
                  to group events into device-based incidents within the Threat Visualizer.
                example: 10
              sid:
                type: integer
                format: int64
                description: The subnet id for the subnet the device is currently located in.
                example: 12
          description: An array of devices involved in the related model alert(s). For incident events created from Darktrace
            ⁄ EMAIL activity, this array is empty.
        relatedBreaches:
          type: array
          items:
            type: object
            properties:
              modelName:
                type: string
                description: The name of the model that triggered a model alert.
                example: Unusual Activity / Unusual Activity from Re-Activated Device
              pbid:
                type: integer
                format: int64
                description: The "policy breach ID" unique identifier of the model alert.
                example: 1234
              threatScore:
                type: number
                description: The alert score of the associated model alert - out of 100.
