            to locate associated connections.
          example: C5mcFh2K3MR4kT9bBc00
        antigenablocked:
          type: string
          description: 'Indicates the event triggered the creation and sending of a Darktrace ⁄ NETWORK RST. At the time the
            action is taken, "antigenablocked": "true" is added to the connection entry. As this is performed at action time,
            Darktrace is unable to ascertain if the action was successful until the connection has demonstrably ended - this
            state therefore represents an attempt to block only. If, after the action, Darktrace detects that the connection
            continued and the action was unsuccessful, "antigenablocked": "true" is updated to "antigenablocked": "false"
            .'
          example: 'TRUE'
        antigenaconnectionend:
          type: string
          description: Experimental field.
          example: 'TRUE'
        info:
          type: string
          description: A message describing the event, or adding commentary from Darktrace analysis.
          example: A slightly unusual time for a failed connection to 10.11.12.12 on port 22. A small increase in failed connections
            to internal IPs
        status:
          type: string
          description: Can contain "failed" for failed connections or "ongoing" for continued connections. Completed connections
            will not return this field.
          example: failed
