                      description: An object containing information about the tag.
                      properties:
                        auto:
                          type: boolean
                          description: Whether the tag was auto-generated.
                          example: false
                        color:
                          type: number
                          description: The hue value (in HSL) used to color the tag in the Threat Visualizer user interface.
                          example: 200.0
                        description:
                          type: string
                          description: An optional description summarizing the purpose of the tag.
                          example: Device is a pool device.
                        visibility:
                          type: string
                          description: Whether the tag is used by one or more model components.
                          example: Public
                    isReferenced:
                      type: boolean
                      description: A system field.
                      example: true
                description: An object describing tags applied to the device.
              macaddress:
                type: string
                description: The current MAC address associated with the device.
                example: 56:2d:4b:9c:18:42
              vendor:
                type: string
                description: The vendor of the device network card as derived by Darktrace from the MAC address.
              hostname:
                type: string
                description: The current device hostname.
                example: ws173
          description: An array of devices that correspond to the "did" values in the actions array.
      title: /antigena — Response Schema - fulldevicedetails=true
      description: 'Fuente: https://customerportal.darktrace.com/guides/api-antigena-schema'
    AntigenaIncludeconnectionsTrue:
      type: object
      properties:
        actions:
          type: array
          items:
            type: object
            properties:
              codeid:
                type: integer
                format: int64
                description: A unique id for the Darktrace Autonomous Response action.
                example: 4895
              did:
                type: integer
                format: int64
                description: The "device id" of the device the action is applied against.
                example: 239
              ip:
                type: string
                description: The IP that the action is applied against.
                example: 10.12.14.2
              action:
                type: string
                description: The type of action being performed.
                example: quarantine
              manual:
                type: boolean
                description: Whether the action was triggered manually by a user.
                example: false
              triggerer:
                description: If triggered manually, an object describing the user who triggered the action. If triggered by
                  Darktrace automatically, "null".
                properties:
                  username:
                    type: string
                    description: Username of the user who triggered the manual action. Only present for manual actions.
                    example: b.ash
                  reason:
                    type: string
                    description: The "reason" provided by the user for the action trigger, where the "reason" field is required
                      by deployment configuration. Only present for manual actions.
              label:
                type: string
                description: The readable label for the action being performed.
                example: Quarantine device
              detail:
                type: string
                description: Any additional detail about the action being performed.
              score:
                type: number
                description: The model alert score of the model alert that triggered the Darktrace Autonomous Response action.
                example: 0.3
              pbid:
                type: integer
                format: int64
                description: The model alert 'policy breach id' of the model alert that triggered the action.
                example: 449859
              model:
                type: string
                description: The name of the model that triggered the Darktrace Autonomous Response action.
                example: Anomalous File::Masqueraded File Transfer
              modeluuid:
                type: string
                description: The unique identifier for the model that triggered the Darktrace Autonomous Response action.
                example: ee88d329-6cdd-8dd3-5baa-2e323g3fa833
              start:
                type: integer
                format: int64
                description: The start time of the action in epoch time.
                example: 1586190000000
              expires:
                type: number
                description: The expiry time of the action in epoch time.
                example: 1586190000000.0
              blocked:
                type: boolean
                description: Whether the action blocked any matching connections.
                example: false
              updated:
                type: string
                description: When the action was last updated. For example, a user extending an action.
                example: '1586190000000'
              agemail:
                type: boolean
                description: Whether the action was triggered by Darktrace ⁄ EMAIL.
                example: false
              aghost:
                type: boolean
                description: Whether the action was triggered for Darktrace ⁄ ENDPOINT agents.
                example: false
              active:
                type: boolean
                description: Whether the action has been activated at some point.
                example: true
              cleared:
                type: boolean
                description: Whether the action has been manually cleared by an operator.
                example: false
          description: An array of Darktrace Autonomous Response actions.
        connections:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
                description: The type of action being performed that blocked the connection.
                example: quarantine
              label:
                type: string
                description: The readable label for the action being performed.
                example: Quarantine device
              did:
                type: integer
                format: int64
                description: The "device id" of the device the action is applied against.
                example: 239
              direction:
                type: string
                description: The direction of the blocked connection in relation to the actioned device.
                example: outgoing
              ip:
                type: string
                description: Depending on connection direction, the IP that the actioned device is connecting to or is being
                  connected to by.
                example: 10.0.18.224
              port:
                type: integer
                format: int64
                description: Depending on connection direction, the port that the actioned device is connecting to or is being
                  connected to on.
                example: 3128
              timems:
                type: integer
                format: int64
                description: The time that the blocked connection was attempted in epoch time.
                example: 1584265931000
              time:
                type: string
                description: The time that the blocked connection was attempted in readable format.
                example: '2020-03-15 09:52:11'
          description: An array of connections blocked by one or more Darktrace Autonomous Response actions.
      title: /antigena — Response Schema - includeconnections=true
      description: 'Fuente: https://customerportal.darktrace.com/guides/api-antigena-schema'
