paths:
  /advancedsearch/api/search/{query}:
    get:
      tags:
      - advancedsearch
      summary: dt_advanced_search.AdvancedSearch.search(post_request=False)
      operationId: get_advancedsearch_api_search_query
      description: '**Implementado en el SDK por:** `dt_advanced_search.AdvancedSearch.search(post_request=False)` (darktrace/dt_advanced_search.py:11
        (ruta en :88))


        **Notas:** La query se reconstruye: solo se conservan las claves search (def ''''), fields (def []), offset (def 0),
        timeframe (def ''3600'') y time (def {''user_interval'':0}). Si la query trae from+to -> timeframe=''custom'', time={''from'',''to'',''user_interval'':''0''}
        (string ''0''); elif interval -> timeframe=str(interval) y NO se envía ''time''; else time=query.get(''time''). En
        GET NO se soportan starttime/endtime (sí en POST). Cualquier otra clave (p.ej. ''size'', documentada en sus propios
        docs) se DESCARTA silenciosamente. encode_query (dt_utils.py:340) = base64.b64encode(json.dumps(query)) con separadores
        por defecto ('', '' y '': '') y alfabeto base64 estándar (puede contener ''/'', ''+'', ''='') insertado en el path
        sin URL-encoding. La firma se calcula sobre el path completo incluyendo el base64.


        Código: https://github.com/LegendEvent/darktrace-sdk/blob/main/darktrace/dt_advanced_search.py'
      parameters:
      - name: query
        in: path
        required: true
        schema:
          type: string
        description: 'Tipo en el SDK: `str`.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: El SDK devuelve el JSON de la respuesta sin modelar.
        default:
          description: Error HTTP (el SDK lanza requests.HTTPError)
  /advancedsearch/api/search:
    post:
      tags:
      - advancedsearch
      summary: dt_advanced_search.AdvancedSearch.search(post_request=True)
      operationId: post_advancedsearch_api_search
      description: '**Implementado en el SDK por:** `dt_advanced_search.AdvancedSearch.search(post_request=True)` (darktrace/dt_advanced_search.py:28-63)


        **Notas:** Body JSON {''hash'': base64(json(full_query))}. full_query = search, fields, offset, timeframe (def ''3600''),
        time (def {''user_interval'':0}); from+to o starttime+endtime -> timeframe ''custom'' y time {''from'',''to'',''user_interval'':''0''};
        interval -> timeframe=str(interval) (time se mantiene con default). ''size'' y otras claves se descartan. SDK lo marca
        como 6.1+.


        Código: https://github.com/LegendEvent/darktrace-sdk/blob/main/darktrace/dt_advanced_search.py'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hash:
                  type: string
                  format: byte
                  description: 'Tipo en el SDK: `str (base64 de JSON)`.'
              required:
              - hash
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: El SDK devuelve el JSON de la respuesta sin modelar.
        default:
          description: Error HTTP (el SDK lanza requests.HTTPError)
