openapi: 3.0.3
info:
  title: Darktrace Threat Visualizer API (según darktrace-sdk)
  version: 0.10.1 (darktrace/_version.py:4; CHANGELOG 2026-10-01)
  description: 'Schema derivado del código de https://github.com/LegendEvent/darktrace-sdk (clone --depth 1) (versión 0.10.1
    (darktrace/_version.py:4; CHANGELOG 2026-10-01)). Describe lo que el SDK envía realmente, no la documentación oficial;
    ver darktrace-threat-visualizer.yaml y DIFF-sdk-vs-docs.md.


    ## Firma

    HMAC-SHA1(key=private_token ASCII, msg=f''{signed_path}\n{public_token}\n{date}'' UTF-8).hexdigest() (darktrace/auth.py:83-96).
    signed_path (auth.py:47-69): request_path (sin host) + si hay params: ''?'' + ''&''.join(''k=v'') con claves ordenadas
    alfabéticamente, valores None eliminados, bool -> ''true''/''false'', listas/tuplas -> claves repetidas (k=a&k=b) en orden;
    valores SIN url-encoding (texto plano, p.ej. espacios literales). Si hay JSON body: se añade json.dumps(body, separators=('','','':''))
    (compacto, orden de inserción, ensure_ascii por defecto) precedido de ''&'' si había params o ''?'' si no -> ''/modelbreaches/101/comments?{"message":"x"}''.
    El body se envía con los mismos separadores (dt_utils.py:186). Los params normalizados (ordenados, booleans en minúscula)
    son los que se envían (auth.py:80, ''clean or params''). Form POST (_post_form, dt_utils.py:202-235): body = urlencode(sorted(items))
    y la firma se calcula pasando valores quote_plus(str(v)) como params -> firma ''path?k=v_urlencoded&...'' idéntica al
    body en el cable (asimetría: GET firma valores sin codificar, form POST firma valores codificados). Para GET con path
    dinámico (advancedsearch) el base64 forma parte del path firmado.


    ## Cabeceras

    - DTAPI-Token: <public token>

    - DTAPI-Date: YYYY-MM-DD HH:MM:SS (UTC, datetime.now(timezone.utc))

    - DTAPI-Signature: hex HMAC-SHA1

    - Content-Type: application/json (siempre, incluso en GET/DELETE; sobrescrito a application/x-www-form-urlencoded en _post_form)'
