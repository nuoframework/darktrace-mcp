x-sdk-suspected-bugs:
- AdvancedSearch.search descarta silenciosamente 'size' y cualquier clave distinta de search/fields/offset/timeframe/time
  (dt_advanced_search.py:32-38, 66-71) -> imposible paginar con size != 50 por defecto.
- AdvancedSearch.search GET ignora starttime/endtime (solo el POST los mapea) y con 'interval' no envía 'time'; time.user_interval
  es int 0 por defecto pero string '0' en rangos custom.
- Base64 estándar (con '/', '+', '=') en el path GET sin url-safe ni url-encoding (dt_utils.py:349-350); '/' en el base64
  rompería el routing del path; json.dumps con espacios por defecto.
- 'Firma GET con valores sin codificar mientras requests los url-encodea en el cable (espacios en from/to, saasfilter con
  ''*'', query de devicesearch con comillas): depende de que el servidor decodifique antes de verificar; en form POST se hace
  lo contrario (firma codificada).'
- JSON POST con query params firma 'path?a=1&{json}', combinación no documentada (breaches.add_comment/acknowledge con **params).
- Subnets.post mete responsedata en el body JSON en lugar de la query.
- Details.get envía siempre eventtype=connection y DeviceInfo.get siempre datatype/showallgraphdata/fulldevicedetails/intervalhours.
- DeviceSummary.get expone 13 params no documentados.
- Antigena.create_manual_action docstring promete int codeid pero devuelve JSON crudo; reason siempre enviado aunque vacío.
- Tags.get(tag_id=0) y PCAPs.get(pcap_id='') caen al listado por chequeo de truthiness.
- 'Content-Type: application/json se envía también en GET/DELETE.'
- README menciona /aianalyst incidents no implementado.
