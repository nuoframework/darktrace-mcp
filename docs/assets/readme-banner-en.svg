 <title id="title">Darktrace MCP — Unofficial MCP.</title>
 <desc id="description">Unofficial MCP. Developed by an independent third party, unaffiliated with Darktrace and without authorization from Darktrace. Original independent artwork: a white editorial title panel and flowing orange, pink and violet traces on a dark field.</desc>
